<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacheden 3D</title>
<meta name="description" content="Бар Hacheden в 3D: стойка, курилка с камином и читальня с книгами.">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
/* Бар тёмный в любом режиме: те же значения для светлой и тёмной темы. */
  :root {
    color-scheme: dark;
    --brass: #d6aa5c;
    --cream: #f1e4cc;
    --muted: #c2a784;
    --walnut: #4a2c1a;
    --font-display: "Forum", "Palatino Linotype", Georgia, serif;
    --font-text: "Literata", Georgia, "Times New Roman", serif;
    --bh: clamp(92px, 15svh, 168px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: #070304; }
  body { height: 100%; margin: 0; background: #070304; color: var(--cream); font-family: var(--font-text); overflow-x: hidden; }

  
/* ---------- переходы между комнатами ---------- */
  .go { position: absolute; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 12px 12px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .go svg { width: 18px; height: 18px; }
  .go:hover { border-color: var(--brass); color: var(--brass); }
  .go:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .go-left { left: 18px; }
  .go-right { right: 18px; flex-direction: row-reverse; padding: 12px 12px 12px 16px; }
  .go.off { visibility: hidden; pointer-events: none; }

  
/* ---------- музыка ---------- */
  .music { position: absolute; top: 18px; right: 18px; z-index: 4; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 8px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .music:hover { border-color: var(--brass); color: var(--brass); }
  .music:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .music.on { border-color: var(--brass); }
  .disc { width: 30px; height: 30px; flex: none; }
  .music.on .disc { animation: spin 3.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .order { left: 18px; right: auto; }
  .served { position: absolute; bottom: calc(100% - 14px); width: 40px; transform: translateX(-50%); pointer-events: none; }
  .served svg { display: block; width: 100%; height: auto; }
  .app.mixing .bottle.in svg { filter: drop-shadow(0 0 10px rgba(255,210,122,.95)); }
  .app.mixing .bottle.in .name { color: var(--brass); }

  /* ---------- барная карта ---------- */
  dialog.mix { position: fixed; inset: 0 0 0 auto; z-index: 8; margin: 0; padding: 0; border: 0;
    border-left: 1px solid rgba(214,170,92,.35); width: min(440px, 100%); height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, rgba(38,12,19,.97), rgba(20,8,11,.98)); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.mix[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  .mix-inner { padding: 22px 24px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .mix-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mix-top h2 { margin: 0; font: 400 34px/1.1 var(--font-display); }
  .mix-top .close { top: 0; }
  .tabs { display: flex; gap: 4px; width: fit-content; margin: 16px 0 4px; padding: 4px;
    border: 1px solid rgba(214,170,92,.3); border-radius: 999px; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: 400 17px/1 var(--font-display);
    padding: 9px 18px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: rgba(214,170,92,.2); color: var(--cream); }
  .mix h3 { margin: 24px 0 10px; font: 400 20px/1.2 var(--font-display); color: var(--brass); }
  .mix-note { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 1px solid rgba(214,170,92,.35); background: rgba(255,255,255,.03); color: var(--cream);
    font: 400 15px/1 var(--font-text); padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .2s, border-color .2s; }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="true"] { background: rgba(214,170,92,.24); border-color: var(--brass); }
  .chip:focus-visible, .tab:focus-visible, .make:focus-visible, .clear:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .drinks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .drink { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,.035); }
  .drink > svg { width: 30px; height: 43px; }
  .drink b { display: block; font: 400 19px/1.2 var(--font-display); }
  .drink span { display: block; margin-top: 3px; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
  .drink .miss { color: #eab0bc; }
  .make { appearance: none; border: 1px solid var(--brass); background: rgba(214,170,92,.14); color: var(--cream);
    font: 400 15px/1 var(--font-display); padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .make:hover { background: rgba(214,170,92,.3); }
  .make.ghost { border-color: rgba(214,170,92,.45); background: none; }
  .empty { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .clear { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer; padding: 6px 0; margin-top: 16px; }
  .recipe li b { color: var(--brass); font-weight: 600; }

  /* ---------- крупный план: камера наезжает на стойку ---------- */
  .room-bar .scene { transform-origin: 50% 76%; transition: transform 1.15s cubic-bezier(.6,0,.25,1), filter 1.15s ease; }
  .app.cu .room-bar .scene { transform: scale(2.7); filter: blur(7px) brightness(.45); }
  .app.cu-hide .world { visibility: hidden; }
  .closeup { position: fixed; inset: 0; z-index: 9; overflow: hidden; opacity: 0; transform: scale(1.12); pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, #3a0e18 0%, #1a0609 55%, #090203 100%);
    transition: opacity .7s ease .45s, transform 1.25s cubic-bezier(.2,.7,.2,1) .35s; }
  .closeup.in { opacity: 1; transform: none; pointer-events: auto; }
  .closeup.out { opacity: 0; transform: scale(.97); transition: opacity .6s ease, transform .8s ease-in; }
  .cu-bokeh, .cu-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cu-title { position: absolute; top: 22px; left: 0; right: 0; margin: 0; padding: 0 140px; text-align: center; pointer-events: none;
    font: 400 clamp(26px, 4vw, 42px)/1.1 var(--font-display); letter-spacing: .04em; color: #ffe6ea;
    text-shadow: 0 0 4px #fff, 0 0 14px #ff5c7a, 0 0 30px #ff2a55; }
  .go.cu-skip { top: 18px; bottom: auto; right: 18px; padding: 11px 18px; opacity: 1; animation: none; }
  .cu-ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 16px calc(26px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; background: linear-gradient(rgba(8,2,4,0), rgba(8,2,4,.82) 55%); }
  .cu-cap { margin: 0 auto; max-width: 760px; }
  .cu-cap.show { animation: cap-in .45s cubic-bezier(.2,.8,.2,1) both; }
  .cu-count { display: block; min-height: 18px; color: var(--muted); font-size: 14px; }
  .cu-text { display: block; margin-top: 6px; font: 400 clamp(21px, 3vw, 32px)/1.25 var(--font-display); color: var(--cream);
    text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  @keyframes cap-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) {
    .cu-title { top: 76px; padding: 0 16px; font-size: 28px; }
  }

  
/* ---------- книга рецептов ---------- */
  dialog.book { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: none; color: #2a1a10; }
  dialog.book[open] { display: grid; place-items: center; animation: book-in .5s cubic-bezier(.2,.8,.2,1); }
  dialog.book::backdrop { background: rgba(6,2,3,.8); }
  .book-wrap { position: relative; width: min(1080px, 94vw); }
  .book-stage { position: relative; aspect-ratio: 1.45; max-height: 80svh; margin: 0 auto; perspective: 2600px;
    border: 14px solid #3a1a12; border-radius: 10px; background: #3a1a12;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #6a3a22; }
  .page, .leaf .face { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
  .page.left, .leaf .face.l { left: 0; border-radius: 4px 0 0 4px;
    background: linear-gradient(90deg, #e6d4b0, #f6ecd4 14%, #f3e6c8 86%, #d4be94); }
  .page.right, .leaf .face.r { left: 50%; border-radius: 0 4px 4px 0;
    background: linear-gradient(90deg, #d4be94, #f3e6c8 14%, #f6ecd4 86%, #e6d4b0); }
  .leaf { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; z-index: 2; }
  .leaf .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .leaf.fwd { transform-origin: 50% 50%; }
  .leaf .face.r { transform-origin: 0 50%; }
  .leaf .face.l { transform-origin: 100% 50%; }
  .leaf .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 40%); opacity: 0; transition: opacity .9s; }
  .pg { height: 100%; overflow: auto; padding: clamp(18px, 3.4vw, 36px) clamp(18px, 3.4vw, 40px) 46px; font-family: var(--font-text); }
  .pg h2 { margin: 0 0 6px; font: 400 clamp(28px, 3.6vw, 42px)/1.05 var(--font-display); color: #3a1a10; }
  .pg h3 { margin: 16px 0 6px; font: 400 clamp(18px, 2vw, 22px)/1.2 var(--font-display); color: #7a3a1a; }
  .pg p { margin: 0; font-size: clamp(13.5px, 1.35vw, 15.5px); line-height: 1.6; color: #2a1a10; }
  .pg .tag { font-style: italic; color: #6a4a32; }
  .pg dl { margin: 12px 0 0; font-size: 14px; border-top: 1px dotted #a08a64; }
  .pg dl div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dotted #a08a64; }
  .pg dt { color: #6a4a32; } .pg dd { margin: 0; text-align: right; }
  .pg ul { margin: 6px 0 0; padding-left: 18px; font-size: clamp(13.5px, 1.35vw, 15.5px); line-height: 1.6; }
  .pg li b { color: #7a3a1a; }
  .pg-glass { width: clamp(130px, 15vw, 170px); aspect-ratio: 1; margin: 12px auto 6px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, #3a1a14, #1a0a0c 70%); box-shadow: 0 0 0 3px #c9a46a, 0 0 0 7px #3a1a12; }
  .pg-glass svg { height: 82%; width: auto; }
  .pg-num { position: absolute; bottom: 14px; font-size: 13px; color: #8a6a4a; }
  .page.left .pg-num, .leaf .face.l .pg-num { left: 26px; }
  .page.right .pg-num, .leaf .face.r .pg-num { right: 26px; }
  .pg-title { display: grid; place-content: center; text-align: center; height: 100%; gap: 10px; }
  .pg-title .big { font: 400 clamp(46px, 6vw, 72px)/1 var(--font-display); color: #6b0f22; letter-spacing: .06em; }
  .pg-title .orn { width: 160px; margin: 0 auto; }
  .toc { list-style: none; padding: 0; margin: 8px 0 0; }
  .toc li { display: flex; align-items: baseline; gap: 6px; margin: 2px 0; }
  .toc button { appearance: none; border: 0; background: none; padding: 2px 0; font: inherit; color: #2a1a10; cursor: pointer; text-align: left; }
  .toc button:hover { color: #6b0f22; text-decoration: underline; }
  .toc .dots { flex: 1; border-bottom: 1px dotted #a08a64; transform: translateY(-4px); }
  .toc-h { margin: 12px 0 2px; font: 400 18px/1.2 var(--font-display); color: #7a3a1a; }
  .pg .cook { margin-top: 18px; appearance: none; border: 1px solid #6b0f22; background: #6b0f22; color: #f6ecd4; font: 400 17px/1 var(--font-display);
    padding: 11px 18px; border-radius: 999px; cursor: pointer; }
  .pg .cook:hover { background: #8a1428; }
  .pg button:focus-visible { outline: 2px solid #6b0f22; outline-offset: 2px; }
  .book-wrap .book-close { position: absolute; top: -14px; right: -14px; z-index: 5; }
  .book-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .book-arrow { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(214,170,92,.55); background: rgba(14,5,8,.72);
    color: var(--cream); font-size: 28px; line-height: 1; cursor: pointer; }
  .book-arrow:hover { border-color: var(--brass); color: var(--brass); }
  .book-arrow:disabled { opacity: .3; cursor: default; }
  .book-arrow:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  @keyframes book-in { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (max-width: 759px) {
    .book-stage { aspect-ratio: .64; max-height: 74svh; width: 100%; }
    .page.left, .leaf .face.l { display: none; }
    .page.right, .leaf .face.r { left: 0; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #d4be94, #f3e6c8 8%, #f6ecd4 92%, #e6d4b0); }
    .book-wrap .book-close { top: -54px; right: 0; }
  }

  
/* ---------- карточка ---------- */
  dialog.card { margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid rgba(214,170,92,.35);
    width: min(480px, 100%); max-width: 100%; height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, #2a1118, #1a0a0e); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.card[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  dialog.card::backdrop { background: rgba(8,2,4,.62); }
  .close-wrap { position: sticky; top: 0; height: 0; z-index: 2; text-align: right; padding-right: 12px; }
  .close { position: relative; top: 12px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(214,170,92,.5); background: rgba(20,8,10,.78); color: var(--cream); font-size: 22px; line-height: 1; }
  .close:hover { border-color: var(--brass); color: var(--brass); }
  .close:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .card-inner { padding: 28px 28px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card-inner > * { animation: reveal .55s cubic-bezier(.2,.8,.2,1) both; }
  .stage { display: grid; place-items: center; height: 210px; margin: 8px -8px 0;
    background: radial-gradient(closest-side, rgba(255,184,96,.28), transparent 75%); }
  .stage svg { height: 190px; width: auto; }
  .pour { animation: pour-up 1.2s .5s cubic-bezier(.3,.7,.2,1) both; }
  .late { animation: fade-in-late .6s 1.5s both; }
  .title { margin: 8px 0 4px; font: 400 44px/1.1 var(--font-display); }
  .tagline { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
  .facts { margin: 22px 0 4px; border-top: 1px solid rgba(214,170,92,.3); }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(214,170,92,.2); }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; text-align: right; }
  .card h3 { margin: 26px 0 8px; font: 400 22px/1.2 var(--font-display); color: var(--brass); }
  .card p { margin: 0; max-width: 60ch; font-size: 16px; line-height: 1.65; }
  .card ul { margin: 0; padding-left: 20px; line-height: 1.6; }
  .card li { margin: 6px 0; }
  .card b { font-weight: 600; }

  @media (max-width: 640px) {
    dialog.card { margin: auto 0 0 0; width: 100%; height: auto; max-height: 88svh;
      border-left: 0; border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.card[open] { animation-name: slide-up; }
    .card-inner { padding: 24px 22px calc(36px + env(safe-area-inset-bottom, 0px)); }
    .title { font-size: 38px; }
    .go { font-size: 15px; padding: 10px 14px 10px 10px; }
    .go-right { padding: 10px 10px 10px 14px; }
    .prop.glasses { display: none; }
    .music { padding: 8px; }
    .patron { display: none; }
    dialog.mix { inset: auto 0 0 0; width: 100%; height: auto; max-height: 72svh; border-left: 0;
      border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.mix[open] { animation-name: slide-up; }
    .mix-inner { padding: 18px 18px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .mix-top h2 { font-size: 28px; }
    .prop.limes { left: 4%; }
    .prop.bucket { left: 76%; }
    .music .label { display: none; }
  }

  /* ---------- движение ---------- */
  @keyframes blackout { 0%, 25% { opacity: .95; } 45% { opacity: .8; } 65% { opacity: .55; } 85% { opacity: .3; } 100% { opacity: 0; } }
  @keyframes flicker { 0% { opacity: 0; } 8% { opacity: .9; } 14% { opacity: .15; } 24% { opacity: .8; } 30% { opacity: .3; } 44% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes led-on { from { filter: brightness(.25); } to { filter: brightness(1); } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes scene-in { from { transform: scale(1.14); } to { transform: none; } }
  @keyframes door-l { to { transform: rotateY(105deg); visibility: hidden; } }
  @keyframes door-r { to { transform: rotateY(-105deg); visibility: hidden; } }
  @keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pour-up { from { transform: translateY(120px); } to { transform: none; } }
  @keyframes fade-in-late { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pa-turn { 0%, 55%, 100% { transform: rotate(0); } 62%, 84% { transform: rotate(6deg); } }
  @keyframes pb-drink { 0%, 62%, 100% { transform: rotate(150deg); } 72%, 86% { transform: rotate(0deg); } }
  @keyframes pb-tilt { 0%, 70%, 100% { transform: none; } 76%, 84% { transform: translateY(-2px) rotate(-3deg); } }
  @keyframes neon-blink { 0% { opacity: 1; } 10% { opacity: .35; } 18% { opacity: 1; } 30% { opacity: .5; } 36% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-6deg); }
    50% { transform: translateY(4px) rotate(5deg); } 75% { transform: translateY(-6px) rotate(-4deg); } }
  @keyframes flame { 0%, 100% { transform: scale(1, 1) skewX(0); } 25% { transform: scale(.96, 1.07) skewX(-2.5deg); }
    55% { transform: scale(1.03, .95) skewX(2deg); } 80% { transform: scale(.98, 1.05) skewX(-1deg); } }
  @keyframes glow-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .85; } }
  @keyframes wisp { 0% { opacity: .7; transform: translateY(0) scaleX(.8); } 100% { opacity: 0; transform: translateY(-90px) scaleX(1.8); } }
  @keyframes smoke { 0% { opacity: 0; transform: translateY(8px) scale(.7, .8); } 15% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5, 1.2); } }

  @media (prefers-reduced-motion: reduce) {
    .blackout, .doors { display: none; }
    .room-bar .scene, .shelving { animation: none; }
    .neon-text, .hint, .go { opacity: 1; animation: none; }
    .world { transition: none; }
    .flame, .nook-glow, .smoke-wisp, .wisp { animation: none; }
    .smoke-wisp { opacity: .35; }
    .nook-dark { transition: none; }
    .card-inner > *, .pour, .late { animation: none; }
    dialog.card[open] { animation: none; }
    .bottle svg { transition: none; }
    .pa-head, .pb-arm, .pb-head, .neon.blink { animation: none; }
    .dust { display: none; }
    .nk-rain, .nk-drop, .nk-win, .nk-ladder, .nk-reach, .nk-pen, .nk-head, .nk-lamplight, .moth-fly, .moth .wing { animation: none !important; }
    .room-nook.flash .nk-flash, .room-nook.flash .nk-winflash { animation: none !important; }
    dialog.book[open] { animation: none; }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [
    { root: 38, notes: [53, 57, 60, 64] },  // Dm9
    { root: 43, notes: [53, 57, 59, 64] },  // G13
    { root: 36, notes: [52, 55, 59, 62] },  // Cmaj9

  function createBand(ctx, out) {
    const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // электропиано: основной тон и два тихих обертона
    function keys(m, t, dur, vel) {
      const f = mtof(m), g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + .012);
      g.gain.exponentialRampToValueAtTime(vel * .35, t + .45);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      [[1, 1], [2, .16], [3, .04]].forEach(([mul, amp]) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.frequency.value = f * mul;
        o.detune.value = (Math.random() - .5) * 6;
        og.gain.value = amp;
        o.connect(og).connect(g);
        o.start(t); o.stop(t + dur + .05);
      });
      g.connect(out);
    }
    function chord(c, t, dur, vel) {
      c.notes.forEach((n, i) => keys(n, t + i * .018 + Math.random() * .01, dur, vel * (1 - i * .08)));
    }
    function bass(m, t, dur) {
      const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = mtof(m);
      lp.type = "lowpass"; lp.frequency.value = 380;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.2, t + .02);
      g.gain.exponentialRampToValueAtTime(.06, t + dur * .6);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(lp).connect(g).connect(out);
      o.start(t); o.stop(t + dur + .05);
    }
    function brush(t, v) {
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = "bandpass"; f.frequency.value = 6500; f.Q.value = .6;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      s.connect(f).connect(g).connect(out);
      s.start(t, Math.random() * .7, .2);
    }
    function kick(t, v) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(95, t);
      o.frequency.exponentialRampToValueAtTime(42, t + .14);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .32);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + .35);
    }
    // треск пластинки
    function crackle() {
      const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * .004;
        if (Math.random() < .0006) d[i] += (Math.random() * 2 - 1) * .5;
      }
      const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = b; s.loop = true;
      hp.type = "highpass"; hp.frequency.value = 1200;
      g.gain.value = .18;
      s.connect(hp).connect(g).connect(out);
      s.start();
      return s;
    }
    // один шаг — восьмая доля; аккорд меняется каждые два такта
    function play(step, t, beat) {
      const k = step % 16, pos = step % 8, ci = Math.floor(step / 16) % 4;
      const c = CHORDS[ci], next = CHORDS[(ci + 1) % 4];
      if (k === 0) chord(c, t, 3.4, .06);
      if (k === 6 && Math.random() < .5) chord(c, t, 1.6, .035);
      if (k === 11) chord(c, t, 2.2, .045);
      if (pos === 0) bass(c.root, t, beat * 1.8);
      if (pos === 4) bass(Math.random() < .6 ? c.root + 7 : c.root + 12, t, beat * 1.6);
      if (k === 15 && Math.random() < .5) bass(next.root + (Math.random() < .5 ? 1 : -1), t, beat * .45);
      if (pos === 0) kick(t, .16);
      if (pos === 5 && Math.random() < .3) kick(t, .09);
      if (pos === 2 || pos === 6) brush(t, .045);
      else if (Math.random() < .55) brush(t, .012 + Math.random() * .01);
      if (k !== 0 && Math.random() < .09) keys(MELODY[Math.floor(Math.random() * MELODY.length)], t, 1.4, .03);
    }
    return { play, crackle };
  }

/* паркет: доски разной длины и оттенка */
TEX.floor = canvasTex(1024, 1024, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -R(0, 400);
    while (x < w) {
      const len = R(260, 620), l = R(20, 34), hue = R(16, 26);
      g.fillStyle = `hsl(${hue} 45% ${l * .55}%)`;
      g.fillRect(x, r * rh, len, rh);
      g.save(); g.beginPath(); g.rect(x, r * rh, len, rh); g.clip();
      grain(g, x, r * rh, len, rh, "#0a0402", "#8a5a34", 26);
      g.restore();
      g.fillStyle = "rgba(0,0,0,.75)";
      g.fillRect(x, r * rh, 3, rh);
      x += len;
    }
    g.fillStyle = "rgba(0,0,0,.8)";
    g.fillRect(0, r * rh, w, 3);
  }
  speckle(g, w, h, 3000, .06);
}, { repeat: [7, 5] });

/* обои с дамасским узором */
function damask(base, ink, hi) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 1400, .05);
    const motif = (cx, cy, s) => {
      g.save(); g.translate(cx, cy); g.scale(s, s);
      for (const m of [1, -1]) {
        g.save(); g.scale(m, 1);
        g.fillStyle = ink;
        g.beginPath();
        g.moveTo(0, -70); g.bezierCurveTo(34, -58, 46, -22, 16, -4);
        g.bezierCurveTo(46, 4, 52, 36, 22, 50); g.bezierCurveTo(10, 56, 4, 62, 0, 74); g.closePath(); g.fill();
        g.fillStyle = base;
        g.beginPath(); g.moveTo(0, -46); g.bezierCurveTo(18, -38, 22, -18, 6, -8); g.bezierCurveTo(22, 4, 26, 26, 8, 34); g.lineTo(0, 46); g.closePath(); g.fill();
        g.fillStyle = ink;
        g.beginPath(); g.ellipse(34, -34, 7, 15, -.6, 0, 7); g.fill();
        g.beginPath(); g.ellipse(38, 30, 6, 12, .6, 0, 7); g.fill();
        g.restore();
      }
      g.fillStyle = hi;
      g.beginPath(); g.arc(0, 0, 5, 0, 7); g.fill();
      g.restore();
    };
    motif(128, 128, .9);
    for (const [x, y] of [[0, 0], [256, 0], [0, 256], [256, 256]]) motif(x, y, .9);
  });
}

/* персидский ковёр */
function rugTex(base, border, accent, gold) {
  return canvasTex(512, 768, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const band = (m, c, wd) => { g.strokeStyle = c; g.lineWidth = wd; g.strokeRect(m, m, w - 2 * m, h - 2 * m); };
    band(18, border, 34); band(40, gold, 4); band(58, accent, 10); band(74, gold, 3);
    // мотивы на кайме
    g.fillStyle = gold;
    for (let x = 30; x < w - 20; x += 26) { g.beginPath(); g.arc(x, 18, 5, 0, 7); g.arc(x, h - 18, 5, 0, 7); g.fill(); }
    for (let y = 30; y < h - 20; y += 26) { g.beginPath(); g.arc(18, y, 5, 0, 7); g.arc(w - 18, y, 5, 0, 7); g.fill(); }
    // медальон
    g.save(); g.translate(w / 2, h / 2);
    for (const [s, c] of [[1, border], [.78, gold], [.7, accent], [.45, gold], [.38, base], [.2, border]]) {
      g.fillStyle = c; g.beginPath();
      g.moveTo(0, -200 * s); g.lineTo(130 * s, 0); g.lineTo(0, 200 * s); g.lineTo(-130 * s, 0); g.closePath(); g.fill();
    }
    g.restore();
    // мелкий узор поля
    g.fillStyle = accent; g.globalAlpha = .5;
    for (let y = 110; y < h - 100; y += 44) for (let x = 110; x < w - 100; x += 44) {
      if (Math.abs(x - w / 2) / 130 + Math.abs(y - h / 2) / 200 < 1.1) continue;
      g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x + 8, y); g.lineTo(x, y + 8); g.lineTo(x - 8, y); g.fill();
    }
    g.globalAlpha = 1;
    speckle(g, w, h, 9000, .14);
  });
}

TEX.glow = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.45)");
  r.addColorStop(.6, "rgba(255,255,255,.1)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
TEX.puff = canvasTex(128, 128, (g, w, h) => {
  for (let i = 0; i < 18; i++) {
    const x = 64 + R(-22, 22), y = 64 + R(-22, 22), rr = R(18, 40);
    const r = g.createRadialGradient(x, y, 0, x, y, rr);
    r.addColorStop(0, "rgba(255,255,255,.18)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  }
});
const glowSprite = (color, size, x, y, z, parent = world, op = 1) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color, transparent: true, opacity: op,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false }));
  s.scale.set(size, size, 1);
  s.position.set(x, y, z);
  parent.add(s);
  return s;
};

TEX.painting = canvasTex(512, 384, (g, w, h) => {

  sky.addColorStop(0, "#0d1428"); sky.addColorStop(1, "#3a2a3a");
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const moon = g.createRadialGradient(360, 90, 4, 360, 90, 120);
  moon.addColorStop(0, "rgba(255,236,190,1)"); moon.addColorStop(.12, "rgba(255,220,160,.8)"); moon.addColorStop(1, "rgba(255,200,140,0)");
  g.fillStyle = moon; g.fillRect(0, 0, w, h);
  const sea = g.createLinearGradient(0, h * .6, 0, h);
  sea.addColorStop(0, "#1a1a2a"); sea.addColorStop(1, "#05070d");
  g.fillStyle = sea; g.fillRect(0, h * .6, w, h * .4);
  g.strokeStyle = "rgba(255,220,160,.5)";
  for (let i = 0; i < 40; i++) { const y = h * .62 + i * 3.4, x = 360 + R(-30, 30); g.lineWidth = R(1, 2.5); g.beginPath(); g.moveTo(x - R(10, 40), y); g.lineTo(x + R(10, 40), y); g.stroke(); }
  g.fillStyle = "#06070b";
  g.beginPath(); g.moveTo(90, h * .6); g.lineTo(230, h * .6); g.lineTo(212, h * .66); g.lineTo(104, h * .66); g.fill();
  g.fillRect(150, h * .2, 4, h * .4); g.fillRect(120, h * .3, 3, h * .3);
  g.beginPath(); g.moveTo(154, h * .22); g.lineTo(210, h * .55); g.lineTo(154, h * .55); g.fill();
  g.fillStyle = "#ffcc7a"; g.fillRect(180, h * .62, 3, 3);
  g.fillStyle = "#07080c"; g.beginPath(); g.moveTo(0, h * .6); g.lineTo(0, h * .48); g.lineTo(40, h * .52); g.lineTo(70, h * .45); g.lineTo(80, h * .6); g.fill();
  // мазки
  for (let i = 0; i < 2200; i++) { g.globalAlpha = R(0, .07); g.fillStyle = rng() < .5 ? "#fff" : "#000"; g.fillRect(rng() * w, rng() * h, R(2, 9), R(1, 3)); }
  g.globalAlpha = 1;
  const vg = g.createRadialGradient(w / 2, h / 2, h * .3, w / 2, h / 2, w * .7);

});

TEX.globe = canvasTex(512, 256, (g, w, h) => {

});

/* бумага с рукописными строками */
function paperTex(lines = 14, title = "") {
  return canvasTex(256, 340, (g, w, h) => {
    g.fillStyle = "#ece0c2"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 1600, .08);
    if (title) { g.fillStyle = "#4a1a12"; g.font = "30px Forum, Georgia, serif"; g.textAlign = "center"; g.fillText(title, w / 2, 52); }
    g.strokeStyle = "rgba(40,24,16,.55)"; g.lineWidth = 1.6;
    for (let i = 0; i < lines; i++) {
      const y = (title ? 90 : 40) + i * 18; let x = 26;
      g.beginPath(); g.moveTo(x, y);
      while (x < w - 30 - (i % 5 === 4 ? 80 : 0)) { x += R(4, 9); g.lineTo(x, y + R(-2, 2)); }
      g.stroke();
    }
  });
}

/* деревянные панели снизу стен, плинтус и карниз */
(() => {
  const geos = [], rails = [];
  const run = (ax, a0, a1, fixed, side, h = 1.02) => {
    // ax: "x" — стена вдоль x на z=fixed; "z" — вдоль z на x=fixed; side: куда смотрит (+1/-1)
    const t0 = fixed, t1 = fixed + side * .035;
    const B = (u0, u1, y0, y1, d0, d1) => ax === "x"
      ? boxAt(u0, u1, y0, y1, Math.min(d0, d1), Math.max(d0, d1), .8)
      : boxAt(Math.min(d0, d1), Math.max(d0, d1), y0, y1, u0, u1, .8);
    geos.push(B(a0, a1, 0, h, t0, t1));
    rails.push(B(a0, a1, h - .02, h + .05, t0, fixed + side * .065));
    rails.push(B(a0, a1, 0, .16, t0, fixed + side * .055));
    rails.push(B(a0, a1, ROOM.h - .14, ROOM.h, t0, fixed + side * .08));
    const n = Math.max(1, Math.round((a1 - a0) / .78));
    const pw = (a1 - a0) / n;
    for (let i = 0; i < n; i++) {
      const u0 = a0 + i * pw + .09, u1 = a0 + (i + 1) * pw - .09;
      rails.push(B(u0, u1, .26, h - .14, t1, fixed + side * .05));
    }
  };
  run("x", -8, -3.8, -5, 1); run("x", 3.8, 8, -5, 1); run("x", -3.8, 3.8, -5, 1);
  run("z", -5, 6, -8, 1); run("z", -5, 6, 8, -1);
  run("x", -8, 8, 6, -1);
  merged(geos, M.panel);
  merged(rails, M.darkwood);
})();

/* декоративные бутылки: инстансами, чтобы не тормозило на телефоне */
(() => {
  const PAL = ["#16210f", "#2a1308", "#4a2108", "#1c1a10", "#0e1a16", "#3a1a0a", "#22301c", "#56300e", "#1a0c08"];
  const CAPS = ["#c9944a", "#1a1210", "#6a1a1a", "#d8dde2", "#2a1a10"];
  const items = Object.fromEntries(Object.keys(BOTTLE).map(k => [k, []]));
  const caps = [];
  const fill = (y, x0, x1, zRow, free = []) => {
    let x = x0 + R(0, .03);
    while (x < x1 - .05) {
      const shape = pickOne(Object.keys(BOTTLE)), s = R(.82, 1.04), r = bodyR(shape) * s;
      if (x + 2 * r > x1) break;
      const cx = x + r;
      if (!free.some(f => Math.abs(cx - f) < .16)) {
        items[shape].push({ x: cx, y, z: zRow + R(-.02, .02), s, ry: R(0, 6.3), c: pickOne(PAL) });
        const [cr, ch] = BOTTLE[shape].cap;
        caps.push({ x: cx, y: y + neckTop(shape) * s, z: zRow, r: cr / 100 * s, h: ch / 100 * s, c: pickOne(CAPS) });
      }
      x += 2 * r + R(.012, .04);
    }
  };
  const bays = [[-3.12, -1.1], [-1.0, 1.0], [1.1, 3.12]];
  for (const [x0, x1] of bays) {
    fill(BB.shelves[0], x0, x1, BB.z0 + .08, HERO_X);
    fill(BB.shelves[1], x0, x1, BB.z0 + .15);
    fill(BB.shelves[1], x0 + .05, x1, BB.z0 + .06);
    fill(BB.shelves[2], x0, x1, BB.z0 + .15);
    fill(BB.shelves[2], x0 + .04, x1, BB.z0 + .06);
  }
  fill(BB.top, -3.2, -2.3, BB.z0 + .12);
  fill(BB.top, 2.35, 3.2, BB.z0 + .12);
  const mat = std({ roughness: .12, metalness: .15, envMapIntensity: 1.6 });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
  for (const k in items) {
    const list = items[k];
    if (!list.length) continue;
    const im = new THREE.InstancedMesh(BGEO[k + "Lo"], mat, list.length);
    list.forEach((b, i) => {
      q.setFromEuler(e.set(0, b.ry, 0));
      m4.compose(V3(b.x, b.y, b.z), q, V3(b.s, b.s, b.s));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(b.c));
    });
    world.add(im);
  }
  const cg = new THREE.CylinderGeometry(1, 1, 1, 8);
  const ci = new THREE.InstancedMesh(cg, std({ roughness: .4, metalness: .6 }), caps.length);
  caps.forEach((c, i) => {
    m4.compose(V3(c.x, c.y + c.h / 2, c.z), q.identity(), V3(c.r, c.h, c.r));
    ci.setMatrixAt(i, m4); ci.setColorAt(i, col.set(c.c));
  });
  world.add(ci);
})();

function makeGlass(cup, color, { garnish = null, ice = false, op = .85 } = {}) {

    cube.rotation.set(R(0, 1), R(0, 1), 0);
    cube.renderOrder = 5;
  }
  if (garnish) {
    const col = { wheel: 0x9fc23a, wedge: 0x9fc23a, lemon: 0xf2d24a, orange: 0xf08a22, mint: 0x3f8f3a, cherry: 0x9a0f1e, pineapple: 0xf2c84a, olive: 0x7a8a2a }[garnish] || 0x9fc23a;

    else if (garnish === "mint") for (let i = 0; i < 3; i++) { const l = mesh(new THREE.SphereGeometry(.016, 8, 6), std({ color: col }), R(-.01, .01), topY + .01, R(-.01, .01), gr); l.scale.set(1, .35, .6); l.rotation.set(R(0, 1), R(0, 3), 0); }

  return gr;
}

    mesh(new THREE.SphereGeometry(.0105, 8, 6), mDark, s * .036, .118, .089, head);
    const brow = mesh(new THREE.BoxGeometry(.034, .007, .01), mHair, s * .037, .142, .092, head);
    brow.rotation.z = s * -.12;
  }
  mesh(new THREE.SphereGeometry(.017, 10, 8), mSkin, 0, .093, .103, head).scale.set(.8, 1, 1.25);
  if (P.mustache) {
    for (const s of [-1, 1]) {
      const m = mesh(new THREE.CapsuleGeometry(.008, .032, 3, 6), mHair, s * .02, .066, .1, head);
      m.rotation.z = s * 1.2;

    mesh(new THREE.CylinderGeometry(.17, .17, .012, 24), hm, 0, .2, 0, head);
    mesh(new THREE.CylinderGeometry(.09, .105, .1, 20), hm, 0, .25, 0, head);
    mesh(new THREE.CylinderGeometry(.106, .106, .02, 20), std({ color: 0x3a0e16 }), 0, .215, 0, head);

}

/* ================= КУРИЛКА: камин, кресла, граммофон, дверь с глазком ================= */
const NOISE_GLSL = `
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= .5; } return v; }`;
const VERT_UV = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;
const FIRE = { boost: 1, t: 0 };
const flameMats = [];
function flameMat(seedV) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSeed: { value: seedV }, uBoost: { value: 1 } },
    vertexShader: VERT_UV,
    fragmentShader: `uniform float uTime, uSeed, uBoost; varying vec2 vUv; ${NOISE_GLSL}
      void main(){
        vec2 uv = vUv; float t = uTime * 1.4 + uSeed * 10.;
        float n = fbm(vec2(uv.x * 3.5 + uSeed * 3., uv.y * 2.6 - t * 1.5));
        float n2 = fbm(vec2(uv.x * 7. - uSeed, uv.y * 5. - t * 2.4));
        float x = uv.x - .5 + (n - .5) * .42 * uv.y;
        float w = mix(.36, .015, pow(uv.y, .75));
        float body = smoothstep(w, w * .1, abs(x));
        float top = smoothstep(1., .2, uv.y * (.8 + n2 * .7) / uBoost);
        float f = body * top * smoothstep(0., .1, uv.y);
        vec3 col = mix(vec3(.85, .16, .02), vec3(1., .66, .2), smoothstep(.15, .85, f));
        col = mix(col, vec3(1., .93, .7), smoothstep(.8, 1., f) * (1. - uv.y));
        gl_FragColor = vec4(col * f * 1.5, f);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  flameMats.push(m);
  return m;
}

let fxCtx = null;
const fx = () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  fxCtx = fxCtx || new AC();
  fxCtx.resume();
  return fxCtx;
};
function crackle() {
  const c = fx(); if (!c) return;
  const len = c.sampleRate * 1.2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  let env = 0;
  for (let i = 0; i < len; i++) { if (Math.random() < .002) env = .5 + Math.random() * .5; env *= .99; d[i] = (Math.random() * 2 - 1) * env * (1 - i / len); }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = b; f.type = "highpass"; f.frequency.value = 700; g.gain.value = .35;
  s.connect(f).connect(g).connect(c.destination); s.start();
}

function bookcase(axis, a0, a1, fixed, side, top = 3.32) {
  // axis "z": шкаф вдоль стены x=fixed, смотрит в +x (side=1); axis "x": вдоль стены z=fixed, смотрит в +z
  const D = .32, f0 = fixed, f1 = fixed + side * D;
  const B = (u0, u1, y0, y1, d0, d1) => axis === "x"
    ? boxAt(u0, u1, y0, y1, Math.min(d0, d1), Math.max(d0, d1), .8)
    : boxAt(Math.min(d0, d1), Math.max(d0, d1), y0, y1, u0, u1, .8);
  caseBacks.push(B(a0, a1, 0, top, f0, f0 + side * .02));
  caseGeos.push(B(a0 - .03, a1 + .03, top, top + .1, f0, f1 + side * .03));
  caseGeos.push(B(a0, a1, 0, .1, f0, f1));
  const n = Math.max(1, Math.round((a1 - a0) / 1.0)), seg = (a1 - a0) / n;
  for (let i = 0; i <= n; i++) { const u = a0 + i * seg; caseGeos.push(B(u - .025, u + .025, 0, top, f0, f1)); }
  for (const y of SHELF_Y) caseGeos.push(B(a0, a1, y - .025, y, f0, f1));
  for (let i = 0; i < n; i++) for (const y of SHELF_Y) {
    let u = a0 + i * seg + .03;
    const end = a0 + (i + 1) * seg - .03;
    while (u < end - .03) {
      if (rng() < .05) { u += R(.06, .14); continue; }
      const t = R(.026, .06), h = R(.22, .34), d = R(.19, .25);
      if (u + t > end) break;
      const lean = rng() < .04 && u + .12 < end ? R(.15, .3) : 0;
      books.push({ axis, u: u + t / 2 + (lean ? .05 : 0), y: y + h / 2 + (lean ? -.01 : 0), f: fixed + side * (D - d / 2 - .015), t, h, d, lean, c: pickOne(BOOK_COL) });
      u += t + (lean ? .1 : R(0, .004));
    }
  }
}

function poseBartender(t) {
  const P = POSE, pol = P.polish;
  bt.root.position.x = P.x; bt.root.position.z = P.z;
  bt.root.rotation.y = P.ry;
  const c = Math.sin(t * 5.4), s = Math.cos(t * 5.4);
  bt.R.sh.rotation.set(P.rShx + pol * .08 * c, P.rShy + pol * .16 * s, P.rShz + pol * .06 * s);
  bt.R.el.rotation.x = P.rEl + pol * .12 * c;
  bt.L.sh.rotation.set(P.lShx, P.lShy + pol * .05 * Math.sin(t * 1.3), P.lShz);
  bt.L.el.rotation.x = P.lEl;
  bt.L.hand.rotation.x = -(bt.L.sh.rotation.x + bt.L.el.rotation.x) * .9;
  const br = Math.sin(t * 1.7);
  bt.spine.rotation.x = P.lean + .012 * br;
  bt.spine.position.y = .004 * br;
  // шаг
  const w = Math.sin(t * 8.5) * P.walk;
  bt.hips.position.y = 1.0 + .018 * Math.abs(Math.sin(t * 8.5)) * P.walk;
  bt.legs[0].th.rotation.x = .4 * w; bt.legs[1].th.rotation.x = -.4 * w;
  bt.legs[0].kn.rotation.x = Math.max(0, -w) * .6; bt.legs[1].kn.rotation.x = Math.max(0, w) * .6;
  // голова: смотрит на гостя или на бокал
  const ang = Math.atan2(camera.position.x - P.x, camera.position.z - P.z) - P.ry;
  const a = Math.atan2(Math.sin(ang), Math.cos(ang));
  const beat = Music.beat();
  const nod = beat === null ? 0 : Math.pow(Math.max(0, Math.cos(beat * Math.PI * 2)), 6) * .06 * BT.nod;
  bt.head.rotation.y = lerp(P.headY, clamp(a, -.8, .8), P.look);
  bt.head.rotation.x = lerp(P.headX, .04, P.look) + nod;
  // предметы следуют за руками
  bt.root.updateMatrixWorld(true);
  bt.L.hand.getWorldPosition(_v);
  btGlass.position.lerpVectors(GLASS_SPOT, _v.add(_w.set(0, -.03, 0)), BT.gk);
  bt.R.hand.getWorldPosition(_v);
  btRag.position.lerpVectors(RAG_SPOT, _v.add(_w.set(0, -.08, 0)), BT.rk);
  btRag.rotation.set(BT.rk * .3 + (1 - BT.rk) * -Math.PI / 2, P.ry, 0);
  if (BT.held) {
    bt.R.hand.getWorldPosition(_v);
    _v.y -= .16;
    BT.held.root.position.lerpVectors(BT.holdFrom, _v, BT.holdK);
  }
}

async function walkTo(tx, casual = false) {

  const dur = clamp(d / (casual ? .7 : 1.1), .35, 4);
  tween(POSE, { walk: 1 }, .2);
  await tween(POSE, { x: tx }, dur, ease.sine);
  await tween(POSE, { walk: 0 }, .2);
}

/* сам по себе: протирает бокал, переходит, смотрит на гостей, кивает в такт */
async function idleLife() {
  if (STILL) return;
  for (;;) {
    await new Promise(r => setTimeout(r, R(3.2, 6.5) * 1000));
    if (BT.busy || PAUSED) continue;
    const r = rng();
    if (r < .3) {
      await walkTo(clamp(POSE.x + R(-1.8, 1.8), -2.3, 2.3), true);
    } else if (r < .62) {
      tween(POSE, { look: 1 }, .6);
      await new Promise(res => setTimeout(res, R(1.6, 2.8) * 1000));
      if (!BT.busy) tween(POSE, { look: 0 }, .8);
    } else if (r < .8) {
      tween(POSE, { lShx: -1.55, lEl: -1.05, lShz: -.1, headX: -.15, polish: .2 }, .7);
      await new Promise(res => setTimeout(res, 1600));
      if (!BT.busy) tween(POSE, { lShx: REST.lShx, lEl: REST.lEl, lShz: REST.lShz, headX: REST.headX, polish: 1 }, .8);
    } else {
      tween(BT, { nod: 1 }, .5);
      await new Promise(res => setTimeout(res, 4000));
      tween(BT, { nod: 0 }, .5);
    }
  }
}

let curZone = 1, PAUSED = false, flight = null, nudge = 0;
const CAM = { px: 0, py: 0, pz: 0, tx: 0, ty: 0, tz: 0, fov: 50 };
const LOOK = { yaw: 0, pitch: 0, py: 0, pp: 0 };

/* кадр для зоны с учётом экрана: на узком телефоне камера отходит и расширяет угол */
function framed(z, extra = 0) {
  const c = typeof z === "number" ? ZONES[z] : z;
  const aspect = innerWidth / innerHeight;
  const pos = V3(...c.pos), tgt = V3(...c.tgt);
  const dir = pos.clone().sub(tgt), dist = dir.length();
  dir.normalize();
  let vfov = 50;
  const hOf = v => 2 * Math.atan(Math.tan(v / 2 * D2R) * aspect);
  const span = (c.span || 6) * (aspect < .8 ? .8 : 1);   // на телефоне чуть ближе: остальное можно рассмотреть, проведя пальцем
  const need = 2 * Math.atan(span / 2 / dist);
  if (hOf(vfov) < need) vfov = Math.min(68, 2 * Math.atan(Math.tan(need / 2) / aspect) / D2R);
  let d2 = dist;
  if (hOf(vfov) < need) d2 = Math.min(dist + (c.pull || 0), (span / 2) / Math.tan(hOf(vfov) / 2));
  d2 -= extra;
  const p = tgt.clone().addScaledVector(dir, d2);
  return { px: p.x, py: p.y, pz: p.z, tx: tgt.x, ty: tgt.y, tz: tgt.z, fov: vfov };
}
function setCam(s) { Object.assign(CAM, s); }
/* перелёт по дуге: камера чуть отступает назад и плавно разворачивается */
function flyTo(s, dur = 1.8, back = .9) {
  if (STILL) { setCam(s); return Promise.resolve(); }
  return new Promise(res => {
    if (flight) flight.res();
    const A = Object.assign({}, CAM);
    const mid = V3((A.px + s.px) / 2, (A.py + s.py) / 2 + .12, (A.pz + s.pz) / 2 + back);
    flight = { A, B: s, mid, t0: NOW, dur: dur * 1000, res };
  });
}
function runFlight() {
  if (!flight) return;
  const f = flight, k = clamp((NOW - f.t0) / f.dur, 0, 1), e = ease.io(k), u = 1 - e;
  CAM.px = u * u * f.A.px + 2 * u * e * f.mid.x + e * e * f.B.px;
  CAM.py = u * u * f.A.py + 2 * u * e * f.mid.y + e * e * f.B.py;
  CAM.pz = u * u * f.A.pz + 2 * u * e * f.mid.z + e * e * f.B.pz;
  const et = ease.io(clamp(k * 1.08, 0, 1));
  for (const key of ["tx", "ty", "tz", "fov"]) CAM[key] = lerp(f.A[key], f.B[key], et);
  if (k >= 1) { flight = null; f.res(); }
}

/* ---------- интерфейс ---------- */
const navBtns = [...document.querySelectorAll("#nav button")];
const titleEl = document.getElementById("zone-title"), subEl = document.getElementById("zone-sub");
const spotsEl = document.getElementById("spots"), tip = document.getElementById("tip");
function renderZoneUI(i) {
  navBtns.forEach(b => b.setAttribute("aria-current", String(+b.dataset.zone === i)));
  titleEl.classList.add("swap");
  setTimeout(() => {
    titleEl.firstChild.textContent = ZONES[i].name;
    subEl.textContent = ZONES[i].sub;
    titleEl.classList.remove("swap");
  }, STILL ? 0 : 280);
  if (!mixDlg.open && !busy) hintEl.textContent = ZONES[i].hint;
  spotsEl.innerHTML = "";
  HOT.filter(h => h.userData.hot.zone === i).forEach(h => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "spot"; b.textContent = h.userData.hot.label;
    b.addEventListener("click", () => activate(h));
    b.addEventListener("pointerenter", () => { chipHover = h; });
    b.addEventListener("pointerleave", () => { if (chipHover === h) chipHover = null; });
    b.addEventListener("focus", () => { chipHover = h; });
    b.addEventListener("blur", () => { if (chipHover === h) chipHover = null; });
    h.userData.chip = b;
    spotsEl.appendChild(b);
  });
}
function goZone(i, dur = 1.9) {
  i = clamp(i, 0, 2);
  const same = i === curZone;
  curZone = i; cur = i;
  Music.room(i);
  if (mixDlg.open && i !== 1) mixDlg.close();
  renderZoneUI(i);
  tween(LIGHTS.fill.position, { x: FILL_AT[i].x, y: FILL_AT[i].y, z: FILL_AT[i].z }, same ? .1 : dur);
  tween(LOOK, { yaw: 0, pitch: 0 }, same ? .6 : dur * .8);
  nudge = 0;
  return flyTo(framed(i), same ? .8 : dur, same ? 0 : .9);
}
navBtns.forEach(b => b.addEventListener("click", () => { if (!busy) goZone(+b.dataset.zone); }));

/* ---------- клики и наведение ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null, chipHover = null, pointer = null, mouseAt = null, needRay = false;
function pick(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hotMeshes, false)[0];
  return hit ? hit.object.userData.hotRoot : null;
}
const modalOpen = () => dlg.open || Book.isOpen || (typeof Closeup !== "undefined" && Closeup.active);
async function activate(root) {
  const h = root.userData.hot;
  if (modalOpen()) return;
  if (busy && h.zone !== 1) return;
  if (h.zone !== curZone) await goZone(h.zone);
  h.act();
}
canvas.addEventListener("pointerdown", e => {
  if (!e.isPrimary) return;
  pointer = { x: e.clientX, y: e.clientY, id: e.pointerId, drag: false, yaw: LOOK.yaw, pitch: LOOK.pitch, type: e.pointerType };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  mouseAt = { x: e.clientX, y: e.clientY, type: e.pointerType };
  if (e.pointerType === "mouse") needRay = true;
  if (!pointer || pointer.id !== e.pointerId) return;
  const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
  if (!pointer.drag && Math.hypot(dx, dy) > 7) { pointer.drag = true; app.classList.add("drag"); hideTip(); }
  if (pointer.drag) {
    const k = 1.25 / Math.max(innerWidth, 500);
    const lim = innerWidth / innerHeight < 1 ? .62 : .38;
    LOOK.yaw = clamp(pointer.yaw + dx * k * 1.6, -lim, lim);
    LOOK.pitch = clamp(pointer.pitch + dy * k, -.22, .22);
    for (const t of tweens) if (t.obj === LOOK) tweens.delete(t);
  }
});
canvas.addEventListener("pointerup", e => {
  if (!pointer || pointer.id !== e.pointerId) return;
  const p = pointer;
  pointer = null;
  app.classList.remove("drag");
  if (p.drag) return;
  const root = pick(e.clientX, e.clientY);
  if (root) activate(root);
});
canvas.addEventListener("pointercancel", () => { pointer = null; app.classList.remove("drag"); });
canvas.addEventListener("pointerleave", () => { if (!pointer) { mouseAt = null; needRay = true; } });
function hideTip() { tip.classList.remove("show"); }
addEventListener("keydown", e => {
  if (modalOpen() || mixDlg.open || busy) return;
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); goZone(curZone - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); goZone(curZone + 1); }
});

/* ---------- бутылки, коктейли и связь с барной картой ---------- */
/* кадр на бармена с бутылкой: на компьютере бутылка слева от карточки, на телефоне — над ней */
function serveShot(hx) {
  const wide = innerWidth / innerHeight > 1.05;
  const bx = hx - .45;
  const s = framed({ pos: [bx * .7 + (wide ? .55 : 0), 1.62, -.15], tgt: [bx + (wide ? .75 : 0), wide ? 1.4 : 1.12, -3.6], span: 2.6, pull: 1.6 });
  return s;
}
let pendingCocktail = null;
H3D.bottle = async id => {
  if (mixDlg.open) { toggleIng(id); return; }
  if (busy || BT.busy) return;
  const h = heroes[id];
  if (STILL) { openCard(h.d); return; }
  busy = true;
  hideTip();
  nudge = .55;
  flyTo(serveShot(h.home.x), 1.4, 0);
  await fetchBottle(h);
  busy = false;
  openCard(h.d);
  dlg.addEventListener("close", () => {
    nudge = 0;
    flyTo(framed(1), 1.2, 0);
    returnBottle(h);
  }, { once: true });
};
const baseMake = window.makeCocktail;
window.makeCocktail = async id => {
  if (busy || BT.busy) return;
  if (curZone !== 1) await goZone(1);
  pendingCocktail = COCKTAIL_BY_ID[id];
  await baseMake(id);
};
H3D.prep = () => { if (!STILL) { flyTo(framed(1, .9), 1.2, 0); prepCocktail(); } };
H3D.done = () => {
  if (pendingCocktail) placeServed(pendingCocktail);
  if (STILL) return;
  presentCocktail();
  dlg.addEventListener("close", () => { flyTo(framed(1), 1.3, 0); relax(); }, { once: true });
};
H3D.pause = on => { PAUSED = on; };
H3D.go = i => goZone(i);

/* ---------- пыль в свете ламп ---------- */
const DUST = (() => {
  const N = QUALITY > 1 ? 160 : 80, pos = new Float32Array(N * 3), base = [];
  for (let i = 0; i < N; i++) base.push([R(-3, 3), R(1.15, 2.6), R(-3.4, -1.4), R(0, 6.3), R(.02, .06)]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffc890, size: .012, map: TEX.glow, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
  world.add(p);
  return { N, pos, base, g };
})();

/* ---------- окружение для отражений: снимок самой комнаты ---------- */
function bakeEnvironment() {
  const pm = new THREE.PMREMGenerator(renderer);
  world.position.set(0, -1.6, 1.8);
  const rt = pm.fromScene(scene, .03, .1, 40);
  world.position.set(0, 0, 0);
  scene.environment = rt.texture;
  pm.dispose();
}

/* ---------- главный цикл ---------- */
let last = performance.now(), frames = 0, slowAcc = 0, slowN = 0, neonT = 6 + Math.random() * 6, flashT = 6 + Math.random() * 8;
const _p = V3(), _t = V3(), _d = V3();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (PAUSED || document.hidden) return;
  NOW = now;
  const t = now / 1000;
  runTweens();
  runFlight();
  // камера: положение, взгляд, лёгкое «дыхание» и параллакс мыши
  _p.set(CAM.px, CAM.py, CAM.pz);
  _t.set(CAM.tx, CAM.ty, CAM.tz);
  _d.subVectors(_t, _p);
  const len = _d.length();
  let yaw = Math.atan2(_d.x, _d.z), pitch = Math.asin(clamp(_d.y / len, -1, 1));
  if (mouseAt && mouseAt.type === "mouse" && !pointer && !STILL) {
    LOOK.py = lerp(LOOK.py, -(mouseAt.x / innerWidth - .5) * .07, .05);
    LOOK.pp = lerp(LOOK.pp, -(mouseAt.y / innerHeight - .5) * .04, .05);
  } else { LOOK.py = lerp(LOOK.py, 0, .03); LOOK.pp = lerp(LOOK.pp, 0, .03); }
  yaw += LOOK.yaw + LOOK.py; pitch += LOOK.pitch + LOOK.pp;
  if (!STILL) { _p.y += Math.sin(t * .8) * .006; _p.x += Math.sin(t * .37) * .008; }
  camera.position.copy(_p);
  camera.lookAt(_p.x + Math.sin(yaw) * Math.cos(pitch), _p.y + Math.sin(pitch), _p.z + Math.cos(yaw) * Math.cos(pitch));
  if (Math.abs(camera.fov - CAM.fov) > .01) { camera.fov = CAM.fov; camera.updateProjectionMatrix(); }

  // наведение
  if (needRay && mouseAt && !pointer && !modalOpen()) {
    needRay = false;
    hovered = mouseAt.type === "mouse" ? pick(mouseAt.x, mouseAt.y) : null;
  } else if (!mouseAt || modalOpen()) hovered = null;
  const lit = hovered || chipHover;
  app.classList.toggle("hover", !!hovered);
  if (hovered && mouseAt) {
    tip.textContent = hovered.userData.hot.label;
    tip.style.transform = `translate(${Math.min(mouseAt.x + 16, innerWidth - tip.offsetWidth - 8)}px, ${mouseAt.y + 18}px)`;
    tip.classList.add("show");
  } else hideTip();
  for (const h of HOT) {
    const d = h.userData.hot, want = h === lit ? 1 : 0;
    d.h += (want - d.h) * Math.min(1, dt * 10);
    if (d.grow) h.scale.copy(d.base).multiplyScalar(1 + d.grow * d.h);
    if (d.lift && !h.userData.out) h.position.y = d.y0 + d.lift * d.h;
    if (d.chip) d.chip.classList.toggle("lit", want === 1);
  }
  // бутылки в шейкере светятся золотом
  for (const id in heroes) {
    const hr = heroes[id], inS = mixDlg.open && inShaker.has(id);
    const target = mixDlg.open ? (inS ? 1 : .4) : .2 + hr.root.userData.hot.h * .4;
    hr.halo.material.opacity += (target - hr.halo.material.opacity) * Math.min(1, dt * 6);
    hr.halo.material.color.setHex(inS ? 0xffd27a : 0xffb070);
    if (hr.root.userData.hot.chip) hr.root.userData.hot.chip.classList.toggle("in", inS);
  }

  poseBartender(t);
  // камин
  FIRE.boost += (1 - FIRE.boost) * dt * .5;
  const fl = .78 + .14 * Math.sin(t * 7.3) + .1 * Math.sin(t * 13.1 + 1) + .06 * Math.sin(t * 23.7);
  LIGHTS.fire.intensity = LIGHTS.fire.userData.base * fl * FIRE.boost;
  for (const m of flameMats) { m.uniforms.uTime.value = t; m.uniforms.uBoost.value = Math.min(1.35, FIRE.boost); }
  FIRE.logMat.emissiveIntensity = .3 + .12 * Math.sin(t * 2.1) * fl;
  FIRE.glow.material.opacity = .38 * fl * FIRE.boost;
  {
    const e = FIRE.embers;
    for (let i = 0; i < e.N; i++) {
      e.life[i] += dt * (.35 + (i % 5) * .06) * (FIRE.boost > 1.1 ? 1.8 : 1);
      if (e.life[i] > 1) e.life[i] -= 1;
      const k = e.life[i];
      e.pos[i * 3] = 7.82 - k * .25 + Math.sin(i * 7 + t * 2) * .04;
      e.pos[i * 3 + 1] = .18 + k * 1.1;
      e.pos[i * 3 + 2] = FP.z + Math.sin(i * 3.1 + t * 1.3) * (.1 + k * .15);
    }
    e.eg.attributes.position.needsUpdate = true;
  }
  for (const c of FIRE.candles) c.material.opacity = .62 + .12 * Math.sin(t * 9 + c.position.z * 3);
  // часы
  {
    const d = new Date(), h = d.getHours() % 12, m = d.getMinutes() + d.getSeconds() / 60;
    FIRE.hour.rotation.x = -(h + m / 60) / 12 * Math.PI * 2;
    FIRE.min.rotation.x = -m / 60 * Math.PI * 2;
  }
  // дым сигары
  for (const s of smoke) {
    s.userData.t += dt * .09;
    if (s.userData.t > 1) s.userData.t -= 1;
    const k = s.userData.t;
    s.position.set(FIRE.smokeFrom.x + Math.sin(k * 9 + s.id) * .05 * k, FIRE.smokeFrom.y + k * 1.5, FIRE.smokeFrom.z + Math.cos(k * 7 + s.id) * .05 * k);
    const sc = .06 + k * .5;
    s.scale.set(sc, sc, 1);
    s.material.opacity = Math.sin(Math.PI * Math.min(1, k * 1.4)) * .32 * (1 - k);
    s.material.rotation = k * 2 + s.id;
  }
  FIRE.cigarTip.material.color.setHSL(.05, 1, .45 + .1 * Math.sin(t * 1.3));
  for (const s of haze) { s.position.x += Math.sin(t * .1 + s.userData.ph) * .0015; s.material.opacity = .1 + .05 * Math.sin(t * .2 + s.userData.ph); }
  if (Music.on) GR.disc.rotation.y -= dt * 3.4;
  CAT.body.scale.y = .5 + .025 * Math.sin(t * 1.9);
  paperL.rotation.y = .3 + Math.max(0, Math.sin(t * .35)) * .08;
  // читальня
  rainMat.uniforms.uTime.value = t;
  NOOK.flash = Math.max(0, NOOK.flash - dt * 2.2);
  rainMat.uniforms.uFlash.value = NOOK.flash;
  LIGHTS.window.intensity = LIGHTS.window.userData.base + NOOK.flash * 30;
  LIGHTS.lamp.intensity = LIGHTS.lamp.userData.base * LIGHTS.lamp.userData.mul * (NOOK.candleOn ? 1 + .04 * Math.sin(t * 11) : 1);
  NOOK.globeSpeed += (.25 - NOOK.globeSpeed) * dt * .45;
  NOOK.globe.rotation.y += NOOK.globeSpeed * dt;
  if (NOOK.candleOn) { NOOK.flame.scale.set(1, 1 + .15 * Math.sin(t * 13), 1); NOOK.flameGlow.material.opacity = .7 + .1 * Math.sin(t * 9); }
  writer.R.el.rotation.x = -.75 + .05 * Math.sin(t * 7);
  writer.R.sh.rotation.y = .06 * Math.sin(t * 2.3);
  moth.position.set(-6.5 + Math.cos(t * 2.4) * .16, 1.13 + Math.sin(t * 3.1) * .05, -4.3 + Math.sin(t * 2.4) * .16);
  moth.rotation.y = -t * 2.4; moth.scale.x = .6 + .4 * Math.abs(Math.sin(t * 30));
  flashT -= dt;
  if (flashT < 0) { flashT = 9 + Math.random() * 12; if (curZone === 0) lightning(); }
  // неон иногда мигает
  neonT -= dt;
  let nb = 1;
  if (neonT < 0 && neonT > -.5) nb = .35 + .65 * (Math.sin(-neonT * 60) > 0 ? 1 : 0);
  else if (neonT <= -.5) neonT = 7 + Math.random() * 9;
  neonMat.opacity = nb; neonGlow.material.opacity = .35 * nb;
  LIGHTS.red.intensity = LIGHTS.red.userData.base * (.8 + .2 * nb);
  // пыль
  for (let i = 0; i < DUST.N; i++) {
    const b = DUST.base[i];
    DUST.pos[i * 3] = b[0] + Math.sin(t * .2 + b[3]) * .3;
    DUST.pos[i * 3 + 1] = b[1] + Math.sin(t * b[4] * 4 + b[3]) * .2;
    DUST.pos[i * 3 + 2] = b[2] + Math.cos(t * .17 + b[3]) * .2;
  }
  DUST.g.attributes.position.needsUpdate = true;
  for (const fn of tickers) fn(t, dt);

  if (!TEST) renderer.render(scene, camera);
  // если тормозит: уменьшаем разрешение
  if (started) {
    frames++;
    slowAcc += dt; slowN++;
    if (slowN >= 90) {
      const fps = slowN / slowAcc;
      if (fps < 40 && DPR > .85) { DPR = Math.max(.85, DPR - .25); renderer.setPixelRatio(DPR); }
      slowAcc = 0; slowN = 0;
    }
  }
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (started && !flight) setCam(framed(curZone, nudge));
}
addEventListener("resize", resize);

/* ---------- вход ---------- */
let started = false;
const intro = document.getElementById("intro"), enter = document.getElementById("enter");
resize();
setCam(framed(INTRO_CAM));
CAM.fov = framed(1).fov;
progress(.7);
bakeEnvironment();
renderer.compile(scene, camera);
renderer.render(scene, camera);
progress(1);
H3D.ready = true;
H3D.render = () => renderer.render(scene, camera);
H3D.info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures, dpr: DPR, zone: curZone, busy, btBusy: BT.busy });
renderZoneUI(1);
requestAnimationFrame(tick);
enter.disabled = false;
enter.focus({ preventScroll: true });
enter.addEventListener("click", async () => {
  if (started) return;
  started = true;
  intro.classList.add("gone");
  let pref = null;
  try { pref = localStorage.getItem("hacheden-music"); } catch (e) {}
  if (pref !== "off" && !Music.on) setMusic(true);
  renderer.toneMappingExposure = STILL ? 1.2 : .15;
  if (!STILL) tween(renderer, { toneMappingExposure: 1.2 }, 2.2, ease.out);
  await flyTo(framed(1), 3.2, .4);
  idleLife();
});

</script>
</body>
