<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacheden</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
  /* Бар тёмный в любом режиме: те же значения для светлой и тёмной темы. */
  :root {
    color-scheme: dark;
    --brass: #d6aa5c;
    --cream: #f1e4cc;
    --muted: #c2a784;
    --walnut: #4a2c1a;
    --font-display: "Forum", "Palatino Linotype", Georgia, serif;
    --font-text: "Literata", Georgia, "Times New Roman", serif;
    --bh: clamp(92px, 15svh, 168px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: #070304; }
  body { height: 100%; margin: 0; background: #070304; color: var(--cream); font-family: var(--font-text); overflow-x: hidden; }

  /* ---------- мир из трёх комнат ---------- */
  .app { position: relative; height: 100%; min-height: 640px; overflow: hidden; }
  .world { position: absolute; inset: 0; width: 300%; display: flex; transform: translateX(-33.3333%);
    transition: transform 1.2s cubic-bezier(.65, 0, .25, 1); }
  .app[data-room="0"] .world { transform: translateX(0); }
  .app[data-room="2"] .world { transform: translateX(-66.6667%); }
  .room { position: relative; flex: 0 0 33.3333%; height: 100%; overflow: hidden;
    --tableH: calc(clamp(560px, 100vw, 1000px) * .2201); }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .art-box { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: clamp(560px, 100vw, 1000px); aspect-ratio: 1000 / 560; }
  .art-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .table-ext { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tableH); }
  .room-note { position: absolute; left: 0; right: 0; top: clamp(20px, 6svh, 60px); text-align: center;
    color: var(--muted); font-size: 15px; pointer-events: none; }

  /* ---------- переходы между комнатами ---------- */
  .go { position: absolute; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 12px 12px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .go svg { width: 18px; height: 18px; }
  .go:hover { border-color: var(--brass); color: var(--brass); }
  .go:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .go-left { left: 18px; }
  .go-right { right: 18px; flex-direction: row-reverse; padding: 12px 12px 12px 16px; }
  .go.off { visibility: hidden; pointer-events: none; }

  /* ================= БАР ================= */
  .room-bar { background: #0b0407; }
  .room-bar::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 38%, rgba(255,50,80,.2), transparent 62%); }
  .wall { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .3; }
  .room-bar .scene { animation: scene-in 3.6s .4s cubic-bezier(.16,.8,.24,1) backwards; }

  .neon { position: relative; z-index: 3; flex: 0 0 clamp(54px, 9svh, 88px); display: grid; place-items: center; }
  .neon-text { margin: 0; font: 400 clamp(34px, 6vw, 62px)/1 var(--font-display); letter-spacing: .1em; color: #ffe6ea;
    text-shadow: 0 0 4px #fff, 0 0 12px #ff5c7a, 0 0 28px #ff2a55, 0 0 60px #ff2a55;
    opacity: 0; animation: flicker 1.4s 2.2s forwards; }

  .shelving { position: relative; flex: 0 0 auto; width: min(96vw, 820px); margin: 0 auto; padding: 14px 18px 4px;
    border: 8px solid #190a0d; border-radius: 4px;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,80,100,.5), rgba(200,28,62,.34) 55%, rgba(70,8,26,.9) 100%), #1a0509;
    box-shadow: inset 0 0 60px rgba(255,40,80,.32), 0 0 90px rgba(255,40,80,.25), 0 14px 34px rgba(0,0,0,.6);
    animation: led-on 1.6s 1.9s ease-out backwards; }
  .row { position: relative; display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 6px 0; }
  .row + .row { margin-top: 10px; }
  .row::before { content: ""; position: absolute; left: -18px; right: -18px; top: -2px; height: 3px;
    background: linear-gradient(90deg, transparent, #ffb3c0 10%, #ffb3c0 90%, transparent);
    box-shadow: 0 0 14px 4px rgba(255,60,90,.6); }
  .row::after { content: ""; position: absolute; left: -18px; right: -18px; bottom: 28px; height: 12px;
    background: linear-gradient(#5a1d2a, #2a0d14); box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 -2px 10px rgba(255,80,100,.35); }
  .bottle { appearance: none; background: none; border: 0; margin: 0; padding: 0 6px; min-width: 76px; perspective: 700px;
    color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
  .bottle svg { display: block; height: var(--bh); width: calc(var(--bh) * .3); overflow: visible;
    filter: drop-shadow(0 0 10px rgba(255,70,100,.35)); transition: transform .25s ease, opacity .4s ease; }
  .bottle .name { margin-top: 12px; height: 28px; line-height: 28px; font-family: var(--font-display);
    font-size: 16px; color: var(--muted); transition: color .2s; }
  .bottle:hover svg, .bottle:focus-visible svg { transform: translateY(-10px); }
  .bottle:hover .name, .bottle:focus-visible .name { color: var(--brass); }
  .bottle:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 6px; }
  .shelving.picking .bottle:not(.chosen) svg { opacity: .4; }
  .decor { position: absolute; left: 0; right: 0; bottom: 40px; height: var(--bh); pointer-events: none; }
  .decor svg { position: absolute; bottom: 0; transform: translateX(-50%); height: calc(var(--bh) * var(--s, .8));
    width: calc(var(--bh) * var(--s, .8) * .3); overflow: visible; opacity: .62; }

  .service { position: relative; flex: 1 1 auto; min-height: 80px; }
  .rail { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: min(96vw, 860px); height: auto; pointer-events: none; }
  .bartender { position: absolute; left: 0; bottom: -8px; height: calc(100% + 8px); max-height: 260px; overflow: visible;
    pointer-events: none; transform: translateX(calc(50vw - 50%)); will-change: transform; }
  .patron { position: absolute; bottom: 0; z-index: 1; width: clamp(150px, 15vw, 230px); height: auto; pointer-events: none; overflow: hidden; }
  .patron.a { left: 1.5%; }
  .patron.b { right: 1.5%; }
  .pa-head { transform-box: view-box; transform-origin: 100px 84px; animation: pa-turn 11s ease-in-out infinite; }
  .pb-arm { transform-box: view-box; transform-origin: 148px 118px; transform: rotate(150deg); animation: pb-drink 13s ease-in-out 2s infinite; }
  .pb-head { transform-box: view-box; transform-origin: 100px 86px; animation: pb-tilt 13s ease-in-out 2s infinite; }
  .dust { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; mix-blend-mode: screen; }
  .neon.blink { animation: neon-blink .8s steps(1, end); }

  .counter { position: relative; flex: 0 0 clamp(118px, 17svh, 160px); display: flex; flex-direction: column; }
  .counter-top { position: relative; height: 30px;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, transparent 1px 5px),
      linear-gradient(180deg, #3a181e 0, #25100f 45%, #160809 100%);
    border-top: 2px solid rgba(255,130,150,.5); box-shadow: 0 -8px 30px rgba(255,50,80,.3); }
  .counter-front { flex: 1; display: grid; place-content: start center; text-align: center; padding: 20px 16px 0;
    background: repeating-linear-gradient(90deg, #1b0c0e 0 62px, #120708 62px 64px), #1b0c0e;
    box-shadow: inset 0 14px 18px rgba(0,0,0,.55); }
  .hint { position: relative; z-index: 3; margin: 0; color: var(--muted); font-size: 15px; opacity: 0; animation: fade-in .9s 3.4s forwards; }
  .prop { position: absolute; bottom: calc(100% - 14px); overflow: visible; }
  .prop.limes { left: 24%; width: 92px; }
  .prop.glasses { left: 36%; width: 86px; }
  .prop.bucket { left: 62%; width: 48px; }
  .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.12)),
      radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 20%, rgba(4,1,2,.8) 100%); }

  /* ================= ЧИТАЛЬНЯ ================= */
  .room-nook { background: #060403; }
  .room-nook .table-ext { background: linear-gradient(180deg, #2a180d 0, #120a05 55%, #080402 100%);
    border-top: 1px solid rgba(255,190,110,.25); }
  .nook-glow { position: absolute; left: 50%; top: 30%; width: 200%; height: 200%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,180,90,.3) 0%, rgba(255,150,60,.1) 25%, transparent 50%);
    pointer-events: none; transition: opacity .6s; animation: glow-pulse 3.2s ease-in-out infinite; }
  .nook-dark { position: absolute; inset: 0; background: #030201; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  .room-nook.unlit .nook-dark { opacity: .8; }
  .room-nook.unlit .flame, .room-nook.unlit .nook-glow { opacity: 0; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 2.6s ease-in-out infinite; transition: opacity .35s; }
  .wisp { opacity: 0; filter: blur(2px); transform-box: fill-box; transform-origin: 50% 100%; }
  .room-nook.unlit .wisp { animation: wisp 3.6s ease-out 1; }
  .candle-btn { position: absolute; left: 44%; top: 20%; width: 13%; height: 42%; background: none; border: 0;
    border-radius: 12px; cursor: pointer; z-index: 3; }
  .candle-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; }

  /* ================= КУРИЛКА ================= */
  .room-smoke { background: #080403; --cord: clamp(40px, 12svh, 120px); }
  .room-smoke .table-ext { background: linear-gradient(180deg, #2b1a0f 0, #150b06 55%, #080402 100%);
    border-top: 1px solid rgba(255,190,110,.18); }
  .smoke-wall { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 40%),
      repeating-linear-gradient(90deg, #241209 0 70px, #150b06 70px 73px); }
  .pendant { position: absolute; top: 0; left: 42%; width: 56px; margin-left: -28px; }
  .cord { display: block; width: 2px; height: var(--cord); margin: 0 auto; background: #0c0607; }
  .shade { display: block; width: 56px; height: 44px; }
  .bulb-on { position: absolute; left: 50%; top: calc(var(--cord) + 38px); width: 18px; height: 14px; margin-left: -9px;
    border-radius: 0 0 9px 9px; background: #ffe6ad;
    box-shadow: 0 0 14px 6px rgba(255,200,110,.75), 0 0 40px 16px rgba(255,170,80,.35); }
  .cone { position: absolute; left: 42%; top: calc(var(--cord) + 44px); bottom: calc(var(--tableH) * .55); width: min(70vw, 620px);
    transform: translateX(-50%); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, rgba(255,190,110,.32), rgba(255,170,90,.03)); pointer-events: none; }
  .pool { position: absolute; left: -25%; top: -10%; width: 150%; height: 130%; pointer-events: none;
    background: radial-gradient(ellipse at 43% 72%, rgba(255,190,110,.22) 0%, transparent 38%); }
  .paper-btn { position: absolute; left: 21%; top: 64%; width: 37%; height: 35%; background: none; border: 0;
    border-radius: 6px; cursor: pointer; z-index: 3; transition: box-shadow .2s, background .2s; }
  .paper-btn:hover { background: rgba(255,230,170,.06); box-shadow: inset 0 0 0 2px rgba(214,170,92,.5); }
  .paper-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; }
  .smoke-wisp { fill: none; stroke: rgba(235,235,245,.5); stroke-width: 6; stroke-linecap: round; filter: blur(3px);
    transform-box: fill-box; transform-origin: 50% 100%; animation: smoke 7s ease-in infinite; opacity: 0; }
  .smoke-wisp.s2 { animation-delay: -2.3s; }
  .smoke-wisp.s3 { animation-delay: -4.6s; }

  /* ---------- музыка ---------- */
  .music { position: absolute; top: 18px; right: 18px; z-index: 4; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 8px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .music:hover { border-color: var(--brass); color: var(--brass); }
  .music:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .music.on { border-color: var(--brass); }
  .disc { width: 30px; height: 30px; flex: none; }
  .music.on .disc { animation: spin 3.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .order { left: 18px; right: auto; }
  .served { position: absolute; bottom: calc(100% - 14px); width: 40px; transform: translateX(-50%); pointer-events: none; }
  .served svg { display: block; width: 100%; height: auto; }
  .app.mixing .bottle.in svg { filter: drop-shadow(0 0 10px rgba(255,210,122,.95)); }
  .app.mixing .bottle.in .name { color: var(--brass); }

  /* ---------- барная карта ---------- */
  dialog.mix { position: fixed; inset: 0 0 0 auto; z-index: 8; margin: 0; padding: 0; border: 0;
    border-left: 1px solid rgba(214,170,92,.35); width: min(440px, 100%); height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, rgba(38,12,19,.97), rgba(20,8,11,.98)); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.mix[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  .mix-inner { padding: 22px 24px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .mix-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mix-top h2 { margin: 0; font: 400 34px/1.1 var(--font-display); }
  .mix-top .close { top: 0; }
  .tabs { display: flex; gap: 4px; width: fit-content; margin: 16px 0 4px; padding: 4px;
    border: 1px solid rgba(214,170,92,.3); border-radius: 999px; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: 400 17px/1 var(--font-display);
    padding: 9px 18px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: rgba(214,170,92,.2); color: var(--cream); }
  .mix h3 { margin: 24px 0 10px; font: 400 20px/1.2 var(--font-display); color: var(--brass); }
  .mix-note { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 1px solid rgba(214,170,92,.35); background: rgba(255,255,255,.03); color: var(--cream);
    font: 400 15px/1 var(--font-text); padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .2s, border-color .2s; }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="true"] { background: rgba(214,170,92,.24); border-color: var(--brass); }
  .chip:focus-visible, .tab:focus-visible, .make:focus-visible, .clear:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .drinks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .drink { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,.035); }
  .drink > svg { width: 30px; height: 43px; }
  .drink b { display: block; font: 400 19px/1.2 var(--font-display); }
  .drink span { display: block; margin-top: 3px; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
  .drink .miss { color: #eab0bc; }
  .make { appearance: none; border: 1px solid var(--brass); background: rgba(214,170,92,.14); color: var(--cream);
    font: 400 15px/1 var(--font-display); padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .make:hover { background: rgba(214,170,92,.3); }
  .make.ghost { border-color: rgba(214,170,92,.45); background: none; }
  .empty { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .clear { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer; padding: 6px 0; margin-top: 16px; }
  .recipe li b { color: var(--brass); font-weight: 600; }

  /* ---------- вход: двери ---------- */
  .blackout { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: #070204; opacity: .95;
    animation: blackout 3.6s ease-out forwards; }
  .doors { position: absolute; inset: 0; z-index: 7; perspective: 1400px; pointer-events: none; overflow: hidden; }
  .door { position: absolute; top: 0; bottom: 0; width: 50.2%; backface-visibility: hidden;
    background: radial-gradient(ellipse at 50% 18%, rgba(255,190,110,.2), transparent 62%),
      repeating-linear-gradient(90deg, #3a2113 0 58px, #26140a 58px 60px);
    box-shadow: inset 0 0 60px rgba(0,0,0,.7); }
  .door::before { content: ""; position: absolute; inset: 6% 12%; border: 2px solid rgba(214,170,92,.35); border-radius: 3px;
    box-shadow: inset 0 0 0 8px rgba(0,0,0,.18); }
  .door::after { content: ""; position: absolute; top: 46%; width: 12px; height: 88px; border-radius: 7px;
    background: linear-gradient(90deg, #8f6a2c, #e2b866 50%, #8f6a2c); box-shadow: 0 4px 8px rgba(0,0,0,.5); }
  .door.l { left: 0; transform-origin: left center; animation: door-l 2s .45s cubic-bezier(.65,0,.25,1) forwards; }
  .door.l::after { right: 16px; }
  .door.r { right: 0; transform-origin: right center; animation: door-r 2s .45s cubic-bezier(.65,0,.25,1) forwards; }
  .door.r::after { left: 16px; }

  /* ---------- карточка ---------- */
  dialog.card { margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid rgba(214,170,92,.35);
    width: min(480px, 100%); max-width: 100%; height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, #2a1118, #1a0a0e); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.card[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  dialog.card::backdrop { background: rgba(8,2,4,.62); }
  .close-wrap { position: sticky; top: 0; height: 0; z-index: 2; text-align: right; padding-right: 12px; }
  .close { position: relative; top: 12px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(214,170,92,.5); background: rgba(20,8,10,.78); color: var(--cream); font-size: 22px; line-height: 1; }
  .close:hover { border-color: var(--brass); color: var(--brass); }
  .close:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .card-inner { padding: 28px 28px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card-inner > * { animation: reveal .55s cubic-bezier(.2,.8,.2,1) both; }
  .stage { display: grid; place-items: center; height: 210px; margin: 8px -8px 0;
    background: radial-gradient(closest-side, rgba(255,184,96,.28), transparent 75%); }
  .stage svg { height: 190px; width: auto; }
  .pour { animation: pour-up 1.2s .5s cubic-bezier(.3,.7,.2,1) both; }
  .late { animation: fade-in-late .6s 1.5s both; }
  .title { margin: 8px 0 4px; font: 400 44px/1.1 var(--font-display); }
  .tagline { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
  .facts { margin: 22px 0 4px; border-top: 1px solid rgba(214,170,92,.3); }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(214,170,92,.2); }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; text-align: right; }
  .card h3 { margin: 26px 0 8px; font: 400 22px/1.2 var(--font-display); color: var(--brass); }
  .card p { margin: 0; max-width: 60ch; font-size: 16px; line-height: 1.65; }
  .card ul { margin: 0; padding-left: 20px; line-height: 1.6; }
  .card li { margin: 6px 0; }
  .card b { font-weight: 600; }

  @media (max-width: 640px) {
    dialog.card { margin: auto 0 0 0; width: 100%; height: auto; max-height: 88svh;
      border-left: 0; border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.card[open] { animation-name: slide-up; }
    .card-inner { padding: 24px 22px calc(36px + env(safe-area-inset-bottom, 0px)); }
    .title { font-size: 38px; }
    .go { font-size: 15px; padding: 10px 14px 10px 10px; }
    .go-right { padding: 10px 10px 10px 14px; }
    .prop.glasses { display: none; }
    .music { padding: 8px; }
    .patron { display: none; }
    dialog.mix { inset: auto 0 0 0; width: 100%; height: auto; max-height: 72svh; border-left: 0;
      border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.mix[open] { animation-name: slide-up; }
    .mix-inner { padding: 18px 18px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .mix-top h2 { font-size: 28px; }
    .prop.limes { left: 4%; }
    .prop.bucket { left: 76%; }
    .music .label { display: none; }
  }

  /* ---------- движение ---------- */
  @keyframes blackout { 0%, 25% { opacity: .95; } 45% { opacity: .8; } 65% { opacity: .55; } 85% { opacity: .3; } 100% { opacity: 0; } }
  @keyframes flicker { 0% { opacity: 0; } 8% { opacity: .9; } 14% { opacity: .15; } 24% { opacity: .8; } 30% { opacity: .3; } 44% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes led-on { from { filter: brightness(.25); } to { filter: brightness(1); } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes scene-in { from { transform: scale(1.14); } to { transform: none; } }
  @keyframes door-l { to { transform: rotateY(105deg); visibility: hidden; } }
  @keyframes door-r { to { transform: rotateY(-105deg); visibility: hidden; } }
  @keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pour-up { from { transform: translateY(120px); } to { transform: none; } }
  @keyframes fade-in-late { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pa-turn { 0%, 55%, 100% { transform: rotate(0); } 62%, 84% { transform: rotate(6deg); } }
  @keyframes pb-drink { 0%, 62%, 100% { transform: rotate(150deg); } 72%, 86% { transform: rotate(0deg); } }
  @keyframes pb-tilt { 0%, 70%, 100% { transform: none; } 76%, 84% { transform: translateY(-2px) rotate(-3deg); } }
  @keyframes neon-blink { 0% { opacity: 1; } 10% { opacity: .35; } 18% { opacity: 1; } 30% { opacity: .5; } 36% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-6deg); }
    50% { transform: translateY(4px) rotate(5deg); } 75% { transform: translateY(-6px) rotate(-4deg); } }
  @keyframes flame { 0%, 100% { transform: scale(1, 1) skewX(0); } 25% { transform: scale(.96, 1.07) skewX(-2.5deg); }
    55% { transform: scale(1.03, .95) skewX(2deg); } 80% { transform: scale(.98, 1.05) skewX(-1deg); } }
  @keyframes glow-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .85; } }
  @keyframes wisp { 0% { opacity: .7; transform: translateY(0) scaleX(.8); } 100% { opacity: 0; transform: translateY(-90px) scaleX(1.8); } }
  @keyframes smoke { 0% { opacity: 0; transform: translateY(8px) scale(.7, .8); } 15% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5, 1.2); } }

  @media (prefers-reduced-motion: reduce) {
    .blackout, .doors { display: none; }
    .room-bar .scene, .shelving { animation: none; }
    .neon-text, .hint, .go { opacity: 1; animation: none; }
    .world { transition: none; }
    .flame, .nook-glow, .smoke-wisp, .wisp { animation: none; }
    .smoke-wisp { opacity: .35; }
    .nook-dark { transition: none; }
    .card-inner > *, .pour, .late { animation: none; }
    dialog.card[open] { animation: none; }
    .bottle svg { transition: none; }
    .pa-head, .pb-arm, .pb-head, .neon.blink { animation: none; }
    .dust { display: none; }
    dialog.mix[open] { animation: none; }
    .music { opacity: 1; animation: none; }
    .music.on .disc { animation: none; }
  }
</style>
</head>

    </section>

    <!-- ===== Бар ===== -->
    <section class="room room-bar" id="room-bar" aria-label="Бар">

        <svg class="wall" aria-hidden="true" focusable="false">

    <!-- ===== Курилка ===== -->

            <g fill="#2a2018"><circle cx="290" cy="486" r="9"/><rect x="280" y="494" width="20" height="30"/><circle cx="330" cy="482" r="9"/><rect x="320" y="490" width="20" height="34"/><circle cx="368" cy="488" r="9"/><rect x="358" y="496" width="20" height="28"/></g>

  /* ---------- музыка: сочиняется прямо в браузере, чужих треков нет ---------- */
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [
    { root: 38, notes: [53, 57, 60, 64] },  // Dm9
    { root: 43, notes: [53, 57, 59, 64] },  // G13
    { root: 36, notes: [52, 55, 59, 62] },  // Cmaj9
    { root: 45, notes: [55, 59, 60, 64] }   // Am9
  ];
  const MELODY = [72, 74, 76, 79, 81, 84];

  function createBand(ctx, out) {
    const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // электропиано: основной тон и два тихих обертона
    function keys(m, t, dur, vel) {
      const f = mtof(m), g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + .012);
      g.gain.exponentialRampToValueAtTime(vel * .35, t + .45);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      [[1, 1], [2, .16], [3, .04]].forEach(([mul, amp]) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.frequency.value = f * mul;
        o.detune.value = (Math.random() - .5) * 6;
        og.gain.value = amp;
        o.connect(og).connect(g);
        o.start(t); o.stop(t + dur + .05);
      });
      g.connect(out);
    }
    function chord(c, t, dur, vel) {
      c.notes.forEach((n, i) => keys(n, t + i * .018 + Math.random() * .01, dur, vel * (1 - i * .08)));
    }
    function bass(m, t, dur) {
      const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = mtof(m);
      lp.type = "lowpass"; lp.frequency.value = 380;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.2, t + .02);
      g.gain.exponentialRampToValueAtTime(.06, t + dur * .6);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(lp).connect(g).connect(out);
      o.start(t); o.stop(t + dur + .05);
    }
    function brush(t, v) {
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = "bandpass"; f.frequency.value = 6500; f.Q.value = .6;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      s.connect(f).connect(g).connect(out);
      s.start(t, Math.random() * .7, .2);
    }
    function kick(t, v) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(95, t);
      o.frequency.exponentialRampToValueAtTime(42, t + .14);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .32);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + .35);
    }
    // треск пластинки
    function crackle() {
      const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * .004;
        if (Math.random() < .0006) d[i] += (Math.random() * 2 - 1) * .5;
      }
      const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = b; s.loop = true;
      hp.type = "highpass"; hp.frequency.value = 1200;
      g.gain.value = .18;
      s.connect(hp).connect(g).connect(out);
      s.start();
      return s;
    }
    // один шаг — восьмая доля; аккорд меняется каждые два такта
    function play(step, t, beat) {
      const k = step % 16, pos = step % 8, ci = Math.floor(step / 16) % 4;
      const c = CHORDS[ci], next = CHORDS[(ci + 1) % 4];
      if (k === 0) chord(c, t, 3.4, .06);
      if (k === 6 && Math.random() < .5) chord(c, t, 1.6, .035);
      if (k === 11) chord(c, t, 2.2, .045);
      if (pos === 0) bass(c.root, t, beat * 1.8);
      if (pos === 4) bass(Math.random() < .6 ? c.root + 7 : c.root + 12, t, beat * 1.6);
      if (k === 15 && Math.random() < .5) bass(next.root + (Math.random() < .5 ? 1 : -1), t, beat * .45);
      if (pos === 0) kick(t, .16);
      if (pos === 5 && Math.random() < .3) kick(t, .09);
      if (pos === 2 || pos === 6) brush(t, .045);
      else if (Math.random() < .55) brush(t, .012 + Math.random() * .01);
      if (k !== 0 && Math.random() < .09) keys(MELODY[Math.floor(Math.random() * MELODY.length)], t, 1.4, .03);
    }
    return { play, crackle };
  }

  const Music = (() => {
    const BEAT = 60 / 68, EIGHTH = BEAT / 2;
    let ctx = null, tone, master, band, timer = null, nextTime = 0, step = 0, on = false, roomIdx = 1, anchor = 0, sfx = null;
    const roomFreq = () => roomIdx === 1 ? 3400 : 950;   // в соседних комнатах музыка звучит глуше, как из-за стены
    function impulse(sec) {
      const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = b.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      return b;
    }
    function setup() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0;
      tone = ctx.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = roomFreq(); tone.Q.value = .4;
      const dry = ctx.createGain(); dry.gain.value = .8;
      const wet = ctx.createGain(); wet.gain.value = .32;
      const verb = ctx.createConvolver(); verb.buffer = impulse(2.6);
      const comp = ctx.createDynamicsCompressor();
      tone.connect(dry).connect(master);
      tone.connect(wet).connect(verb).connect(master);
      master.connect(comp).connect(ctx.destination);
      band = createBand(ctx, tone);
      band.crackle();
      return true;
    }
    function tick() {
      while (nextTime < ctx.currentTime + .2) {
        band.play(step, nextTime, BEAT);
        nextTime += step % 2 === 0 ? EIGHTH * 1.25 : EIGHTH * .75;   // свинг
        step++;
      }
    }
    function run() {
      nextTime = ctx.currentTime + .1;
      anchor = nextTime - (Math.floor(step / 2) * BEAT + (step % 2 ? EIGHTH * 1.25 : 0));
      clearInterval(timer);
      timer = setInterval(tick, 40);
    }
    function start() {
      if (!ctx && !setup()) return false;
      on = true;
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);

  /* ---------- бармен: живёт своей жизнью и подаёт бутылки ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const Bartender = (() => {
    const svg = document.getElementById("bartender"), service = svg.parentElement;
    const el = id => document.getElementById(id);
    const root = el("bt-root"), head = el("bt-head"), eyes = el("bt-eyes");
    const arm = side => { const g = el("bt-arm" + side); return { up: g.querySelector(".up"), fo: g.querySelector(".fo") }; };
    const L = arm("L"), R = arm("R");
    const items = { shaker: el("bt-shaker"), rag: el("bt-rag"), glass: el("bt-glass"), shoulder: el("bt-rag-shoulder"), spoon: el("bt-spoon"), bottle: el("bt-bottle") };
    // углы рук в градусах: плечо (up) и локоть (fo)
    const REST = { bob: 0, head: 0, look: 0, eyesY: 0, lUp: 8, lFo: -6, rUp: -8, rFo: 6 };
    const P = {
      wipe:   { bob: 0, look: 0, head: -4, eyesY: 2, lUp: 20, lFo: -114, rUp: -20, rFo: 120 },
      shake:  { bob: 0, look: 0, head: 2, eyesY: 0, lUp: 8, lFo: -6, rUp: -50, rFo: -155 },
      reachR: { look: 0, head: 4, eyesY: -3, lUp: 8, lFo: -6, rUp: -168, rFo: -6 },
      reachL: { look: 0, head: -4, eyesY: -3, lUp: 168, lFo: 6, rUp: -8, rFo: 6 },
      lean:   { look: 0, head: 0, eyesY: 1, bob: 10, lUp: 30, lFo: -26, rUp: -30, rFo: 26 },
      pour:   { look: 0, head: 6, eyesY: 3, bob: 2, lUp: 8, lFo: -6, rUp: 10, rFo: 35 }
    };
    const pose = { x: 0, ...REST };
    const CANCEL = Symbol("cancel"), waits = new Set();
    let w = 0, bw = 0, mode = "idle", walkPhase = 0, lastX = 0, tw = null, raf = 0;
    let active = true, hold = false, serving = false, parked = [], nextBlink = 0, blinkUntil = 0;
    const still = reduceMotion.matches;
    const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

    function measure() {
      const nw = service.clientWidth;
      bw = Math.min(service.clientHeight + 8, 260) * 260 / 300;
      svg.style.width = bw + "px";
      if (w && nw && nw !== w) {
        const k = nw / w;
        pose.x *= k;
        if (tw && "x" in tw.to) { tw.from.x *= k; tw.to.x *= k; }   // идёт куда-то — пересчитываем и цель
      }

      if (!pose.x) pose.x = w / 2;

    function bounds() {
      const l = shelving.offsetLeft - service.offsetLeft, r = l + shelving.offsetWidth, half = bw * .42;
      return [Math.max(half, l + half * .5), Math.min(w - half, r - half * .5)];
    }
    function clampX(x) { const [a, b] = bounds(); return b < a ? w / 2 : Math.min(b, Math.max(a, x)); }

    function hand(right, left) {
      items.shaker.style.display = right === "shaker" ? "" : "none";
      items.spoon.style.display = right === "spoon" ? "" : "none";
      items.bottle.style.display = right === "bottle" ? "" : "none";
      items.rag.style.display = right === "rag" ? "" : "none";
      items.shoulder.style.display = right === "rag" ? "none" : "";
      items.glass.style.display = left === "glass" ? "" : "none";
    }

    function render(now) {
      const o = { bob: 0, head: 0, lUp: 0, lFo: 0, rUp: 0, rFo: 0 }, t = now / 1000;
      if (mode === "walk") {
        const k = Math.sin(walkPhase);
        o.bob -= Math.abs(k) * 5; o.lUp += k * 7; o.rUp += k * 7; o.head += k * 1.5;
      } else if (mode === "wipe") {
        const a = t * 2 * Math.PI * 1.1;
        o.rFo += Math.sin(a) * 14; o.rUp += Math.cos(a) * 6;
      } else if (mode === "stir") {

      } else if (mode === "shake") {

      }

        o.head += k * 2.2; o.bob += k * 1.4;
      }
      const breath = 1 + .009 * Math.sin(t * 2 * Math.PI / 4.2);
      const p = pose, lu = p.lUp + o.lUp, lf = p.lFo + o.lFo, ru = p.rUp + o.rUp, rf = p.rFo + o.rFo;
      svg.style.transform = `translateX(${(p.x - bw / 2).toFixed(1)}px)`;
      root.setAttribute("transform", `translate(0 ${(p.bob + o.bob).toFixed(2)}) translate(130 300) scale(1 ${breath.toFixed(4)}) translate(-130 -300)`);
      head.setAttribute("transform", `rotate(${(p.head + o.head + p.look * 3).toFixed(2)} 130 92)`);
      eyes.setAttribute("transform", `translate(${(p.look * 2.5).toFixed(2)} ${p.eyesY.toFixed(2)}) translate(0 58) scale(1 ${now < blinkUntil ? .1 : 1}) translate(0 -58)`);
      L.up.setAttribute("transform", `rotate(${lu.toFixed(2)})`);
      L.fo.setAttribute("transform", `rotate(${lf.toFixed(2)})`);
      R.up.setAttribute("transform", `rotate(${ru.toFixed(2)})`);
      R.fo.setAttribute("transform", `rotate(${rf.toFixed(2)})`);
      items.glass.setAttribute("transform", `rotate(${(-(lu + lf)).toFixed(2)})`);   // бокал всегда стоит ровно
    }

    function frame(now) {
      raf = 0;
      if (!active) return;
      if (tw) {
        const k = Math.min(1, (now - tw.t0) / tw.dur), e = ease(k);
        for (const key in tw.to) pose[key] = tw.from[key] + (tw.to[key] - tw.from[key]) * e;

      }

    function wait(ms) {

      mode = "idle";
      await tween({ look: 0 }, 300);
    }
    function station() {
      const [a, b] = bounds();
      let x = rnd(a, b);
      for (let i = 0; i < 10 && Math.abs(x - pose.x) < (b - a) * .2; i++) x = rnd(a, b);

    }
    async function shake(ms) {

      mode = "idle";
      await tween(REST, 550);
      hand(null, null);
    }
    // что бармен делает, пока его никто не зовёт (число — как часто)
    const ROUTINES = [
      [3, async () => {                                   // протирает бокал
        hand("rag", "glass");
        await tween(P.wipe, 650);
        mode = "wipe";
        await wait(rnd(2600, 4200));
        mode = "idle";
        await tween(REST, 600);
        hand(null, null);
      }],
      [3, () => walkTo(station(), 140)],                  // переходит к другому месту стойки
      [2, () => shake(rnd(1400, 2000))],                  // трясёт шейкер
      [2, async () => {                                   // поправляет бутылку на полке
        await tween(Math.random() < .5 ? P.reachL : P.reachR, 600);
        await wait(rnd(600, 1100));
        await tween(REST, 600);
      }],
      [2, async () => {                                   // опирается на стойку
        await tween(P.lean, 700);
        await wait(rnd(1800, 3200));
        await tween(REST, 700);
      }],
      [2, async () => {                                   // оглядывает зал
        await tween({ look: -1 }, 500); await wait(rnd(500, 900));
        await tween({ look: 1 }, 700); await wait(rnd(500, 900));
        await tween({ look: 0 }, 500);
      }]

    async function life() {
      const total = ROUTINES.reduce((s, r) => s + r[0], 0);
      for (;;) {
        try {
          if (hold || !active) { await park(); continue; }
          await wait(rnd(900, 2600));
          let n = Math.random() * total;
          await ROUTINES.find(([wt]) => (n -= wt) < 0)[1]();
        } catch (e) {
          if (e !== CANCEL) { console.error(e); await new Promise(r => setTimeout(r, 1000)); }
        }
      }
    }

    // клик по бутылке: идёт к ней и тянется к полке; возвращает, сколько это займёт
    function serve(targetX) {

  })();

  /* ---------- атмосфера: пыль в красном свете и мигающий неон ---------- */
  const Ambience = (() => {
    const cv = document.getElementById("dust"), c = cv.getContext("2d"), neon = document.querySelector(".neon");
    let parts = [], raf = 0, W = 0, H = 0, neonTimer = 0, on = false;
    function size() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!parts.length && W) parts = Array.from({ length: Math.round(Math.min(70, W * H / 16000)) }, () => ({
        x: Math.random() * W, y: Math.random() * H, r: .5 + Math.random() * 1.6,
        vx: (Math.random() - .5) * .08, vy: -.04 - Math.random() * .1, a: .08 + Math.random() * .28, ph: Math.random() * 6.28
      }));
    }
    function frame(t) {
      c.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.x += p.vx + Math.sin(t / 3000 + p.ph) * .05;
        p.y += p.vy;
        if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
        if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
        c.fillStyle = `rgba(255,200,190,${(p.a * (.6 + .4 * Math.sin(t / 900 + p.ph))).toFixed(3)})`;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    function blink() {
      neon.classList.remove("blink");
      void neon.offsetWidth;
      neon.classList.add("blink");
      neonTimer = setTimeout(blink, rnd(7000, 16000));
    }
    function setActive(want) {
      if (reduceMotion.matches || want === on) return;
      on = want;
      if (on) {
        raf = requestAnimationFrame(frame);
        neonTimer = setTimeout(blink, rnd(5000, 9000));
      } else {
        cancelAnimationFrame(raf); raf = 0;
        clearTimeout(neonTimer); neonTimer = 0;
      }
    }
    new ResizeObserver(size).observe(cv);
    return { setActive };
  })();

      history: "Название переводится как «Свободная Куба». Напиток появился в Гаване около 1900 года, вскоре после испано-американской войны, когда на остров завезли колу.",
      recipe: [["50 мл", "рома"], ["120 мл", "колы"], ["10 мл", "сока лайма"]],
      steps: "Наполни высокий стакан льдом, выжми в него лайм, налей ром и долей колу. Легко перемешай и укрась долькой лайма." },
    { id: "c-pinacolada", name: "Пина колада", base: "rum", origin: "Пуэрто-Рико", method: "shake", need: ["rum", "pineapple", "coconut"],
      cup: "highball", pour: "#f5ecd2", pourOp: .95, pourLevel: 28, garnish: "pineapple",
      tagline: "Сливочный тропический коктейль с ананасом и кокосом",
      history: "С 1978 года — официальный напиток Пуэрто-Рико. Сразу несколько баров Сан-Хуана называют себя его родиной, а самая известная версия относит рецепт к 1954 году. Название по-испански значит «процеженный ананас».",
      recipe: [["50 мл", "белого рома"], ["30 мл", "кокосовых сливок"], ["50 мл", "ананасового сока"]],
      steps: "Хорошо встряхни всё в шейкере со льдом или взбей в блендере с колотым льдом. Перелей в высокий стакан и укрась долькой ананаса." },
    { id: "c-margarita", name: "Маргарита", base: "tequila", origin: "Мексика", method: "shake", need: ["tequila", "triple", "lime"],
      cup: "coupe", pour: "#e6e8a8", pourOp: .7, pourLevel: 40, garnish: "wheel",
      tagline: "Текила, апельсиновый ликёр и лайм",
      history: "Кто придумал маргариту, точно неизвестно: есть несколько историй о барменах из Мексики и Калифорнии 1930–40-х годов. Ободок бокала часто обмакивают в соль, она подчёркивает вкус лайма.",
      recipe: [["50 мл", "текилы"], ["20 мл", "апельсинового ликёра"], ["15 мл", "сока лайма"]],
      steps: "По желанию сделай солёный ободок: смочи край бокала лаймом и обмакни в соль. Встряхни всё в шейкере со льдом и процеди в бокал." },
    { id: "c-sunrise", name: "Текила санрайз", base: "tequila", origin: "США", method: "build", need: ["tequila", "oj", "grenadine"],
      cup: "highball", pour: "#f6a623", grad: ["#f6a623", "#c8102e"], pourOp: .92, pourLevel: 30, garnish: "orange",
      tagline: "Коктейль, похожий на рассвет в стакане",
      history: "Современный рецепт появился в начале 1970-х в баре в Саусалито, Калифорния. Знаменитым его сделала группа The Rolling Stones, которая пила этот коктейль во время американского тура 1972 года.",
      recipe: [["45 мл", "текилы"], ["90 мл", "апельсинового сока"], ["15 мл", "гренадина"]],
      steps: "Наполни стакан льдом, налей текилу и апельсиновый сок, перемешай. Медленно влей гренадин по краю: он тяжелее и опустится на дно, получится переход от красного к оранжевому. Не перемешивай." },
    { id: "c-gintonic", name: "Джин-тоник", base: "gin", origin: "Великобритания", method: "build", need: ["gin", "tonic", "lime"],
      cup: "highball", pour: "#e3f0f2", pourOp: .5, pourLevel: 30, garnish: "wheel",
      tagline: "Самый простой и самый популярный коктейль с джином",
      history: "Британцы в Индии пили хинный тоник как средство от малярии, а чтобы горечь было легче терпеть, добавляли в него джин, сахар и лайм. Так привычка стала классикой.",
      recipe: [["50 мл", "джина"], ["100–150 мл", "тоника"], ["1", "долька лайма"]],
      steps: "Наполни стакан льдом доверху, налей джин и долей холодный тоник. Выжми лайм и опусти дольку в стакан." },
    { id: "c-negroni", name: "Негрони", base: "gin", origin: "Италия", method: "stir", need: ["gin", "campari", "vermouthR"],
      cup: "rocks", ice: true, pour: "#b0122c", pourOp: .9, pourLevel: 62, garnish: "orange",
      tagline: "Горько-сладкий итальянский аперитив в равных долях",
      history: "По популярной версии, около 1919 года во Флоренции граф Камилло Негрони попросил бармена сделать коктейль «Американо» покрепче и заменить в нём содовую на джин.",
      recipe: [["30 мл", "джина"], ["30 мл", "кампари"], ["30 мл", "красного вермута"]],
      steps: "Налей всё в стакан со льдом и размешивай 20–30 секунд, чтобы напиток охладился. Укрась кружком или цедрой апельсина." },
    { id: "c-martini", name: "Мартини", base: "gin", origin: "США", method: "stir", need: ["gin", "vermouthD"],
      cup: "martini", pour: "#eef2e6", pourOp: .4, pourLevel: 32, garnish: "olive",
      tagline: "Джин и сухой вермут: строгая классика",
      history: "Точное происхождение неизвестно, коктейль появился в США в конце XIX века. Чем меньше в нём вермута, тем мартини называют «суше».",
      recipe: [["60 мл", "джина"], ["10 мл", "сухого вермута"], ["1", "оливка"]],
      steps: "Размешай джин и вермут со льдом в стакане для смешивания 20–30 секунд. Процеди в охлаждённый коктейльный бокал и укрась оливкой на шпажке." },
    { id: "c-collins", name: "Том Коллинз", base: "gin", origin: "США", method: "build", need: ["gin", "lemon", "syrup", "soda"],
      cup: "highball", pour: "#efeed6", pourOp: .55, pourLevel: 30, garnish: "lemon",
      tagline: "Лимонад с джином и пузырьками",
      history: "Известен с 1870-х годов. Название связывают с розыгрышем 1874 года в Нью-Йорке: людям говорили, что некий Том Коллинз распускает о них слухи в соседнем баре, и они шли его искать.",
      recipe: [["45 мл", "джина"], ["30 мл", "лимонного сока"], ["15 мл", "сахарного сиропа"], ["60 мл", "содовой"]],
      steps: "Смешай джин, лимонный сок и сироп в высоком стакане со льдом, долей содовую и легко перемешай. Укрась цедрой лимона." },
    { id: "c-oldfashioned", name: "Олд фэшн", base: "whisky", origin: "США", method: "stir", need: ["whisky", "syrup", "bitters"],
      cup: "rocks", ice: true, pour: "#b8641a", pourOp: .9, pourLevel: 62, garnish: "orange",
      tagline: "Виски, сахар и биттер: коктейль «по-старому»",
      history: "Один из старейших коктейлей. В XIX веке посетители, уставшие от новых сложных рецептов, просили сделать коктейль «по-старому»: просто спирт, сахар, вода и биттер. Отсюда и название.",
      recipe: [["45 мл", "бурбона или ржаного виски"], ["5–10 мл", "сахарного сиропа"], ["2 капли", "ангостуры"]],
      steps: "Смешай сироп и биттер в стакане, добавь виски и крупный кусок льда. Размешивай около 30 секунд и укрась апельсиновой цедрой." },
    { id: "c-manhattan", name: "Манхэттен", base: "whisky", origin: "США", method: "stir", need: ["whisky", "vermouthR", "bitters"],
      cup: "coupe", pour: "#8a2614", pourOp: .9, pourLevel: 40, garnish: "cherry",
      tagline: "Виски и красный вермут с вишней",
      history: "Появился в Нью-Йорке в 1870–80-х годах. Известную легенду о том, что его придумали на приёме Дженни Черчилль в Манхэттенском клубе, историки считают выдумкой: в те дни она была в Англии.",
      recipe: [["50 мл", "ржаного виски"], ["20 мл", "красного вермута"], ["1 капля", "ангостуры"]],
      steps: "Размешай всё со льдом в стакане для смешивания, процеди в охлаждённый бокал и укрась коктейльной вишней." },
    { id: "c-sour", name: "Виски сауэр", base: "whisky", origin: "США", method: "shake", need: ["whisky", "lemon", "syrup"],
      cup: "rocks", ice: true, pour: "#e3bd62", pourOp: .85, pourLevel: 62, garnish: "cherry",
      tagline: "Кисло-сладкий виски с лимоном",
      history: "Сауэры — целое семейство коктейлей: крепкий напиток, кислый сок и сладкое. Рецепт виски сауэр напечатан уже в книге знаменитого бармена Джерри Томаса 1862 года.",
      recipe: [["45 мл", "виски"], ["25 мл", "лимонного сока"], ["20 мл", "сахарного сиропа"]],
      steps: "Хорошо встряхни всё в шейкере со льдом. Процеди в рокс со свежим льдом и укрась вишней. Иногда добавляют яичный белок для пышной пены." },
    { id: "c-sidecar", name: "Сайдкар", base: "cognac", origin: "Франция или Англия", method: "shake", need: ["cognac", "triple", "lemon"],
      cup: "coupe", pour: "#dea04a", pourOp: .85, pourLevel: 40, garnish: "lemon",
      tagline: "Коньяк с апельсиновым ликёром и лимоном",
      history: "Появился во время Первой мировой войны или сразу после неё; на родство претендуют бары Парижа и Лондона. Название означает мотоциклетную коляску.",
      recipe: [["50 мл", "коньяка"], ["20 мл", "апельсинового ликёра"], ["20 мл", "лимонного сока"]],
      steps: "Встряхни всё в шейкере со льдом и процеди в охлаждённое блюдце. Ободок можно обсыпать сахаром." },
    { id: "c-sangria", name: "Сангрия", base: "wine", origin: "Испания", method: "build", need: ["wine", "oj", "soda"],
      cup: "wine", pour: "#7a0f24", pourOp: .88, pourLevel: 40, garnish: "orange",
      tagline: "Вино с фруктами для большой компании",
      history: "Испанский напиток из красного вина, нарезанных фруктов и сока. Название связывают с испанским словом sangre — «кровь» — из-за цвета.",
      recipe: [["150 мл", "красного вина"], ["50 мл", "апельсинового сока"], ["50 мл", "содовой"], ["по вкусу", "нарезанные апельсин и яблоко, немного коньяка"]],
      steps: "Смешай вино, сок и нарезанные фрукты, по желанию добавь немного коньяка и дай постоять в холодильнике хотя бы час. Перед подачей добавь лёд и содовую." },
    { id: "c-nojito", name: "Мохито без алкоголя", base: "none", origin: "Куба", method: "build", need: ["lime", "syrup", "mint", "soda"],
      cup: "highball", pour: "#e6f2da", pourOp: .5, pourLevel: 30, garnish: "mint",
      tagline: "Вся свежесть мохито, только без рома",
      history: "Безалкогольная версия знаменитого кубинского коктейля. Мята, лайм и пузырьки освежают не хуже оригинала.",
      recipe: [["20 мл", "сока лайма"], ["15 мл", "сахарного сиропа"], ["6–8", "листиков мяты"], ["до верха", "содовой"]],
      steps: "Разомни мяту с лаймом и сиропом, засыпь стакан колотым льдом и долей содовую. Перемешай и укрась мятой." }
  ];
  COCKTAILS.forEach(c => {
    c.glassLabel = `${c.name}: ${GLASS_NAME[c.cup]}`;
    c.facts = [["Родина", c.origin], ["Бокал", GLASS_NAME[c.cup]], ["Как делают", METHOD[c.method]]];
  });
  const COCKTAIL_BY_ID = Object.fromEntries(COCKTAILS.map(c => [c.id, c]));

  /* ---------- барная карта ---------- */
  const mixDlg = document.getElementById("mix"), orderBtn = document.getElementById("order");
  const hintEl = document.getElementById("hint"), HINT = hintEl.textContent, served = document.getElementById("served");
  const inShaker = new Set();
  let mixN = 0;

  function drinkRow(c, side, btn) {
    mixN++;
    return `<li class="drink">${glassSVG(c, { pre: "m" + mixN + "-", still: true })}
      <div><b>${c.name}</b><span>${c.need.map(low).join(", ")}</span>${side || ""}</div>${btn}</li>`;
  }
  const makeBtn = c => `<button class="make" type="button" data-make="${c.id}" aria-label="Приготовить: ${c.name}">Приготовить</button>`;

  function renderMix() {
    mixN = 0;
    const picked = [...inShaker];
    document.getElementById("mix-summary").textContent = picked.length
      ? "В шейкере: " + picked.map(low).join(", ") + "."
      : "Шейкер пока пуст. Отмечай ингредиенты ниже или бери бутылки прямо с полки.";
    const can = [], almost = [];
    COCKTAILS.forEach(c => {
      const miss = c.need.filter(i => !inShaker.has(i));
      if (!miss.length) can.push(c);
      else if (miss.length === 1 && c.need.length > 1) almost.push([c, miss[0]]);
    });
    let html = "";
    if (picked.length) {
      html += `<h3>Можно приготовить</h3>` + (can.length
        ? `<ul class="drinks">${can.map(c => drinkRow(c, "", makeBtn(c))).join("")}</ul>`
        : `<p class="empty">Пока ничего. Добавь ещё ингредиентов.</p>`);
      if (almost.length) html += `<h3>Не хватает одного</h3><ul class="drinks">${almost.map(([c, m]) =>
        drinkRow(c, `<span class="miss">Не хватает: ${low(m)}</span>`,
          `<button class="make ghost" type="button" data-add="${m}" aria-label="Добавить ${low(m)} в шейкер">+ ${low(m)}</button>`)).join("")}</ul>`;
    }
    document.getElementById("mix-results").innerHTML = html;
    document.getElementById("mix-chips").innerHTML = ING.map(([title, items]) =>
      `<h3>${title}</h3><div class="chips">${items.map(([id, name]) =>
        `<button class="chip" type="button" data-ing="${id}" aria-pressed="${inShaker.has(id)}">${name}</button>`).join("")}</div>`).join("");
    document.querySelectorAll(".bottle").forEach(b => b.classList.toggle("in", inShaker.has(b.dataset.id)));
  }
  function renderMenu() {
    mixN = 100;
    document.getElementById("panel-menu").innerHTML = BASES.map(([base, title]) => {
      const list = COCKTAILS.filter(c => c.base === base);
      return list.length ? `<h3>${title}</h3><ul class="drinks">${list.map(c => drinkRow(c, "", makeBtn(c))).join("")}</ul>` : "";
    }).join("");
  }
  function toggleIng(id) {
    inShaker.has(id) ? inShaker.delete(id) : inShaker.add(id);
    const keepFocus = document.activeElement && document.activeElement.dataset.ing;
    renderMix();
    if (keepFocus) { const f = mixDlg.querySelector(`[data-ing="${keepFocus}"]`); if (f) f.focus(); }
  }
  function setTab(name) {
    mixDlg.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    document.getElementById("panel-mix").hidden = name !== "mix";
    document.getElementById("panel-menu").hidden = name !== "menu";
  }
  function openMix(tab) {
    if (busy) return;
    if (cur !== 1) setRoom(1);
    renderMix(); renderMenu(); setTab(tab || "mix");
    mixDlg.show();
    app.classList.add("mixing");
    hintEl.textContent = "Кликай по бутылкам на полке, чтобы положить их в шейкер.";
    mixDlg.querySelector(".tab").focus();
  }
  mixDlg.addEventListener("close", () => {
    app.classList.remove("mixing");
    if (!busy) hintEl.textContent = HINT;
  });
  orderBtn.addEventListener("click", () => mixDlg.open ? mixDlg.close() : openMix());
  mixDlg.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.ing) toggleIng(t.dataset.ing);
    else if (t.dataset.add) { inShaker.add(t.dataset.add); renderMix(); }
    else if (t.dataset.make) makeCocktail(t.dataset.make);
    else if (t.dataset.tab) setTab(t.dataset.tab);
    else if ("clear" in t.dataset) { inShaker.clear(); renderMix(); }
    else if ("mixClose" in t.dataset) { mixDlg.close(); orderBtn.focus(); }
  });

  function bottleX(id) {
    const b = document.querySelector(`.bottle[data-id="${id}"]`);
    if (!b) return null;
    const br = b.getBoundingClientRect(), sr = document.querySelector(".service").getBoundingClientRect();
    return br.left + br.width / 2 - sr.left;
  }
  async function makeCocktail(id) {
    if (busy) return;
    const c = COCKTAIL_BY_ID[id];
    c.need.forEach(i => inShaker.add(i));
    busy = true;
    mixDlg.close();
    hintEl.textContent = `Бармен готовит: ${c.name}`;
    const stops = c.need.map(bottleX).filter(x => x !== null).slice(0, 2);
    await Bartender.make(c, stops, () => {
      served.innerHTML = glassSVG(c, { pre: "sv-" });
      served.style.left = Bartender.glassX() + "px";
    });
    hintEl.textContent = HINT;
    busy = false;
    openCard(c);
  }
  addEventListener("keydown", e => {
    if (e.key === "Escape" && mixDlg.open && !dlg.open) { mixDlg.close(); orderBtn.focus(); }
  });

  /* ---------- переходы между комнатами ---------- */
  const app = document.getElementById("app");
  const rooms = [...document.querySelectorAll(".room")];
  const NAMES = ["Читальня", "Бар", "Курилка"];
  const goL = document.getElementById("goL"), goR = document.getElementById("goR");
  let cur = 1;
  function setRoom(i) {
    cur = Math.max(0, Math.min(2, i));
    if (mixDlg.open && cur !== 1) mixDlg.close();
    app.dataset.room = cur;
    Music.room(cur);
    Bartender.setActive(cur === 1);
    Ambience.setActive(cur === 1);
    rooms.forEach((r, n) => r.toggleAttribute("inert", n !== cur));
    goL.classList.toggle("off", cur === 0);
    goR.classList.toggle("off", cur === 2);
    goL.inert = cur === 0;
    goR.inert = cur === 2;
    if (cur > 0) goL.querySelector(".label").textContent = NAMES[cur - 1];
    if (cur < 2) goR.querySelector(".label").textContent = NAMES[cur + 1];
  }
  goL.addEventListener("click", () => setRoom(cur - 1));
  goR.addEventListener("click", () => setRoom(cur + 1));
  addEventListener("keydown", e => {
    if (dlg.open || mixDlg.open) return;
    if (e.key === "ArrowLeft") setRoom(cur - 1);
    if (e.key === "ArrowRight") setRoom(cur + 1);
  });
  let touchX = null;
  app.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  app.addEventListener("touchend", e => {
    if (touchX === null || dlg.open || mixDlg.open) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (dx > 70) setRoom(cur - 1);
    if (dx < -70) setRoom(cur + 1);
  }, { passive: true });
  setRoom(1);
</script>
</body>
</html>
