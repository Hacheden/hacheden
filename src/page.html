<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacheden</title>
<meta name="description" content="Бар Hacheden в 3D: стойка, курилка с камином и читальня с книгами.">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/

  /* ================= 3D ================= */
  html, body { overflow: hidden; overscroll-behavior: none; }
  .app { position: fixed; inset: 0; overflow: hidden; overflow: clip; touch-action: none; user-select: none; -webkit-user-select: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
    transition: transform 1.15s cubic-bezier(.6,0,.25,1), filter 1.15s ease; }
  .app.cu #gl { transform: scale(1.35); filter: blur(7px) brightness(.45); }
  .app.cu-hide #gl { visibility: hidden; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(4,1,2,.55) 100%); }
  .app.hover #gl { cursor: pointer; }
  .app.drag #gl { cursor: grabbing; }

  .zone-title { position: absolute; left: 0; right: 0; top: 20px; z-index: 3; margin: 0; text-align: center; pointer-events: none;
    font: 400 clamp(26px, 3.4vw, 38px)/1 var(--font-display); letter-spacing: .08em; color: #ffe6ea;
    text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 16px #ff4466, 0 0 34px #ff2a55; transition: opacity .5s; }
  .zone-title.swap { opacity: 0; }
  .zone-sub { display: block; margin-top: 8px; font: 400 14px/1.3 var(--font-text); letter-spacing: 0; color: var(--muted); text-shadow: 0 1px 6px #000; }

  .hud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 0 12px calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; justify-items: center; gap: 10px; pointer-events: none;
    background: linear-gradient(rgba(6,2,3,0), rgba(6,2,3,.66) 60%); padding-top: 40px; }
  .hud > * { pointer-events: auto; }
  .hint { margin: 0; max-width: 640px; text-align: center; color: var(--muted); font-size: 14.5px; line-height: 1.45; pointer-events: none; text-shadow: 0 1px 8px #000; }
  .spots { display: flex; gap: 8px; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .spots::-webkit-scrollbar { display: none; }
  .spot { flex: none; appearance: none; border: 1px solid rgba(214,170,92,.35); background: rgba(14,5,8,.62); color: var(--cream);
    font: 400 14.5px/1 var(--font-text); padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: border-color .2s, background .2s; }
  .spot:hover, .spot.lit { border-color: var(--brass); background: rgba(214,170,92,.18); }
  .spot.in { border-color: #ffd27a; background: rgba(255,210,122,.22); }
  .spot:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .nav { display: flex; gap: 4px; padding: 4px; border: 1px solid rgba(214,170,92,.45); border-radius: 999px; background: rgba(14,5,8,.8); }
  .nav button { appearance: none; border: 0; background: none; color: var(--muted); font: 400 17px/1 var(--font-display);
    padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  .nav button[aria-current="true"] { background: rgba(214,170,92,.22); color: var(--cream); }
  .nav button:hover { color: var(--cream); }
  .nav button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .tip { position: absolute; z-index: 5; left: 0; top: 0; padding: 7px 12px; border-radius: 8px; pointer-events: none;
    background: rgba(14,5,8,.86); border: 1px solid rgba(214,170,92,.45); color: var(--cream); font: 400 15px/1.2 var(--font-text);
    white-space: nowrap; opacity: 0; transition: opacity .15s; }
  .tip.show { opacity: 1; }
  .bubble { position: absolute; z-index: 5; left: 0; top: 0; max-width: min(280px, 70vw); padding: 10px 14px; border-radius: 14px;
    background: #f3e8d2; color: #2a1610; font: 400 15px/1.4 var(--font-text); box-shadow: 0 8px 24px rgba(0,0,0,.45);
    pointer-events: none; opacity: 0; transition: opacity .25s; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #f3e8d2; }
  .bubble.show { opacity: 1; }

  /* вход */
  .intro { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px;
    text-align: center; background: radial-gradient(ellipse at 50% 45%, rgba(40,8,14,.75), rgba(5,1,2,.97) 70%);
    transition: opacity 1.1s ease, visibility 1.1s; }
  .intro.closed { background: radial-gradient(ellipse at 50% 45%, rgba(26,6,10,.96), rgba(5,1,2,1) 70%); }
  .owner-out { appearance: none; border: 0; background: none; color: var(--muted); font: 400 13.5px/1.3 var(--font-text);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
  .owner-out:hover { color: var(--brass); }
  .owner-out:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro h1 { margin: 0; font: 400 clamp(56px, 11vw, 120px)/1 var(--font-display); letter-spacing: .06em; color: #ffe9ee;
    text-shadow: 0 0 6px #fff, 0 0 18px #ff4d6d, 0 0 44px #ff2450, 0 0 90px #ff2450; animation: flicker 2.4s .3s both; }
  .intro h1.off { color: #4a2a30; text-shadow: 0 0 2px rgba(255,80,110,.25); animation: none; }
  .status { padding: 8px 16px; border: 1px solid rgba(214,170,92,.45); border-radius: 999px; color: var(--cream) !important; font: 400 17px/1.3 var(--font-display) !important; letter-spacing: .02em; }
  .intro p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 36ch; }
  .enter { appearance: none; margin-top: 8px; padding: 14px 30px; border-radius: 999px; border: 1px solid var(--brass);
    background: rgba(214,170,92,.14); color: var(--cream); font: 400 21px/1 var(--font-display); letter-spacing: .04em; cursor: pointer;
    transition: background .2s, opacity .4s; }
  .enter:hover { background: rgba(214,170,92,.3); }
  .enter:disabled { opacity: .45; cursor: progress; }
  .enter:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .load { width: 180px; height: 2px; border-radius: 2px; background: rgba(214,170,92,.2); overflow: hidden; }
  .load i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .3s; }
  .nogl { max-width: 40ch; }

  .app .music, .app .order { animation-delay: .2s; }
  @media (max-width: 640px) {
    .zone-title { top: 74px; }
    .nav button { padding: 10px 14px; font-size: 16px; }
    .hint { font-size: 13.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #gl, .zone-title, .intro { transition: none; }
    .intro h1 { animation: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<main class="app" id="app" data-room="1">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <h2 class="zone-title" id="zone-title" aria-live="polite">Бар<span class="zone-sub" id="zone-sub"></span></h2>
  <div class="hud">
    <p class="hint" id="hint">Нажми на бутылку, чтобы узнать её историю. Коктейли — в барной карте.</p>
    <div class="spots" id="spots" role="group" aria-label="Что есть в этой комнате"></div>
    <nav class="nav" id="nav" aria-label="Комнаты">
      <button type="button" data-zone="0">Читальня</button>
      <button type="button" data-zone="1" aria-current="true">Бар</button>
      <button type="button" data-zone="2">Курилка</button>
    </nav>
  </div>
  <div class="tip" id="tip" aria-hidden="true"></div>
  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
  <div class="served" id="served" hidden></div>
  <!--@@BUTTONS@@-->
</main>

<div class="intro" id="intro">
  <h1>Hacheden</h1>
  <p id="intro-text">Бар в трёх комнатах: стойка с барменом, курилка у камина и читальня под дождём.</p>
  <div class="load" aria-hidden="true"><i id="load"></i></div>
  <p class="status" id="status" hidden></p>
  <button class="enter" id="enter" type="button" disabled>Войти</button>
  <button class="owner-out" id="owner-out" type="button" hidden>Выйти из режима хозяина</button>
</div>

<!--@@HTML@@-->
<script>
  /* общие связки между 3D-сценой и модулями основной версии */
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let busy = false, cur = 1;
  const app = document.getElementById("app");
  const H3D = {};
  function setRoom(i) { if (H3D.go) H3D.go(i); }
  const Bartender = {
    setActive() {}, release() {}, serve() { return 0; }, glassX() { return 0; },
    prep() { if (H3D.prep) H3D.prep(); }, done() { if (H3D.done) H3D.done(); }
  };
  const Ambience = { setActive(on) { if (H3D.pause) H3D.pause(!on); } };
  function noGL() {
    if (H3D.ready) return;
    document.getElementById("intro-text").textContent = "Бар не открылся: этот браузер не поддерживает 3D-графику (WebGL) или страница не загрузилась. Попробуй обновить страницу или открыть сайт в Chrome, Safari или Firefox.";
    document.getElementById("enter").hidden = true;
    document.querySelector(".load").hidden = true;
  }
  setTimeout(noGL, 25000);
/*@@SHARED@@*/
</script>
<script type="module">
/*@@SCENE@@*/
</script>
</body>
</html>
